<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRED/RANK</title><style>html,body{margin:0;background:#050505;color:#fff;font-family:Inter,system-ui,sans-serif;height:100%}.load{height:100%;display:grid;place-items:center}.box{text-align:center}.bar{width:220px;height:2px;background:#222;overflow:hidden;margin:16px auto}.bar:after{content:"";display:block;height:100%;width:40%;background:#fff;animation:a 1s infinite ease-in-out}@keyframes a{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}</style></head><body><div class="load"><div class="box"><b>PRED/RANK</b><div class="bar"></div><small>Loading…</small></div></div><script>
(async()=>{try{
const files=['chunks/000.txt', 'chunks/001.txt', 'chunks/002.txt', 'chunks/003.txt', 'chunks/004.txt', 'chunks/005.txt', 'chunks/006.txt', 'chunks/007.txt', 'chunks/008.txt', 'chunks/009.txt', 'chunks/010.txt', 'chunks/011.txt', 'chunks/012.txt', 'chunks/013.txt', 'chunks/014.txt', 'chunks/015.txt', 'chunks/016.txt', 'chunks/017.txt', 'chunks/018.txt'];
const parts=await Promise.all(files.map(x=>fetch(x,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error(x+' '+r.status);return r.text()})));
const b64=parts.join('');const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
if(!('DecompressionStream' in window))throw new Error('Browser does not support gzip decompression');
const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([u8]).stream().pipeThrough(ds)).text();
document.open();document.write(text);document.close();
}catch(e){document.body.innerHTML='<div style="padding:40px;font:16px system-ui;color:white;background:#050505;min-height:100vh"><h1>PRED/RANK</h1><p>Could not load the application.</p><pre style="white-space:pre-wrap;color:#aaa"></pre></div>';document.querySelector('pre').textContent=String(e);console.error(e)}})();
</script></body></html>
