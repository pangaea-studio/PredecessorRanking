<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AXIOM — Predecessor Competitive Intelligence</title>
<style>html,body{margin:0;min-height:100%;background:#0b0b0c;color:#fff;font-family:Inter,system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center}.boot span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#9a9a9a}</style>
</head>
<body>
<div class="boot"><span>AXIOM</span></div>
<script>
(async()=>{
  try{
    const [app, overrides, previewCss] = await Promise.all([
      fetch('/app.html?v=20261016-preview-v4',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('app '+r.status);return r.text();}),
      fetch('/axiom-overrides.js?v=20261016-preview-v4',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('overrides '+r.status);return r.text();}),
      fetch('/preview-ui.css?v=20261016-preview-v4',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('preview '+r.status);return r.text();})
    ]);
    const marker='/* DATA / API: the live backend';
    const at=app.indexOf(marker);
    if(at<0)throw new Error('AXIOM override marker not found');
    let src=app.slice(0,at)+overrides+'\n'+app.slice(at);
    const style='<style id="axiom-design-preview-v4">'+previewCss+'</style>';
    src=src.includes('</body>')?src.replace('</body>',style+'</body>'):src+style;
    document.open();
    document.write(src);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="boot"><span>AXIOM preview could not load</span></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
