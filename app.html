ased on Hero Deaths.":"Lilith jagt ihre Beute und schlägt Gegner, die du verletzt hast. Stelle Mana wieder her, indem du die Seelen von Gegnern verzehrst, die in Liliths Nähe getötet wurden. Die Wiederherstellung ist bei Heldentoden erhöht.","Prosecutor":"Ankläger","Send bullets down range with your OA-S3000 SMG.":"Schicke Kugeln mit deiner OA-S3000 SMG auf die Reise.","Place a bomb that detonates after a short delay, dealing damage.\n\nInnovation: Detonate again after a short time.":"Platziere eine Bombe, die nach kurzer Verzögerung detoniert und Schaden verursacht.\n\nInnovation: Detoniert nach kurzer Zeit erneut.","Slam the ground, sending forth a seismic wave that deals damage and knocks up enemies after a short duration.\n\nInnovation: Increased stun duration.":"Schlage auf den Boden und sende eine seismische Welle aus, die nach kurzer Dauer Schaden verursacht und Gegner per Knock-up in die Luft schleudert.\n\nInnovation: Erhöhte Stun-Dauer.","Deploy a drone that drains enemy mana and attacks them when damaging them with an ability or if they cast an ability, dealing damage and draining their mana.\n\nInnovation: The drone's attacks drain additional mana.":"Setze eine Drohne ein, die gegnerisches Mana entzieht und Gegner angreift, wenn du sie mit einer Fähigkeit triffst oder sie eine Fähigkeit wirken, wodurch sie Schaden erleiden und ihnen Mana entzogen wird.\n\nInnovation: Die Angriffe der Drohne entziehen zusätzliches Mana.","Fire a piercing blast from your sidearm, dealing damage to targets, increased based on their missing mana, and silencing them. Deals missing health damage to Manaless Heroes instead.\n\nInnovation: Resets Cooldown if an Enemy Hero is killed.":"Feuere einen durchschlagenden Schuss aus deiner Seitenwaffe ab, der Zielen Schaden zufügt – erhöht basierend auf ihrem fehlenden Mana – und sie mit Silence belegt. Verursacht bei Helden ohne Mana stattdessen Schaden basierend auf fehlender Gesundheit.\n\nInnovation: Setzt den Cooldown zurück, wenn ein gegnerischer Held getötet wird.","Your abilities gain additional strength at maximum rank. Gains increased ability haste each time you max out an ability.":"Deine Fähigkeiten gewinnen auf maximalem Rang zusätzliche Stärke. Erhalte jedes Mal, wenn du eine Fähigkeit auf Maximum bringst, mehr Ability Haste.","The Drowned Forest":"Der Ertrunkene Wald","Cast curses with Morigesh, a voodoo witch whose haunting abilities mark her targets for relentless, inevitable doom.":"Wirke Flüche mit Morigesh, einer Voodoo-Hexe, deren unheimliche Fähigkeiten ihre Ziele für unerbittliches, unausweichliches Verderben markieren.","Throw Fetid Daggers at your enemies.":"Wirf Fetid Daggers auf deine Feinde.","Deal damage to a target, restoring health. If they are a Hero, their soul is rended into your doll, Marking them.":"Füge einem Ziel Schaden zu und stelle Gesundheit wieder her. Handelt es sich um einen Helden, wird seine Seele in deine Puppe gerissen und er wird markiert.","Throw a hive of insects that explodes dealing damage and Slowing targets hit.":"Wirf ein Insektennest, das explodiert, Schaden verursacht und getroffene Ziele verlangsamt.","Become the swarm, gaining movement speed and damage reduction for a duration. Passing through enemies deals damage and restores health.":"Werde zum Schwarm und erhalte für eine Dauer Bewegungstempo und Schadensreduktion. Das Durchqueren von Gegnern verursacht Schaden und stellt Gesundheit wieder her.","Summon a horde of insects to stab the marked target, dealing massive damage.":"Beschwöre eine Insektenhorde, die auf das markierte Ziel einsticht und massiven Schaden verursacht.","Your abilities apply Pestilence for a duration, dealing damage over time.":"Deine Fähigkeiten belegen Gegner für eine Dauer mit Pestilence, was Schaden über Zeit verursacht.","Psychic Stray":"Psychischer Streuner","Link fates with Phase, a psychic support whose telekinetic powers can pull allies away from danger while amplifying their abilities.":"Verbinde dein Schicksal mit Phase, einem psychischen Support, dessen telekinetische Kräfte Verbündete aus der Gefahr ziehen und zugleich ihre Fähigkeiten verstärken können.","Fire psychic bolts at your enemies.":"Feuere psychische Blitze auf deine Feinde.","Create a link between yourself and an ally, granting both increased power. If reactivated, pull the linked ally towards you.":"Erschaffe eine Verbindung zwischen dir und einem Verbündeten, die beiden mehr Kraft verleiht. Bei erneuter Aktivierung ziehst du den verbundenen Verbündeten zu dir.","Blast a flare of psychic energy around you and your linked ally, dealing damage, and reducing your Blink cooldown when hitting Heroes. Enemies facing the flair become blinded.":"Entfessle einen Ausbruch psychischer Energie um dich und deinen verbundenen Verbündeten, verursache Schaden und verringere den Cooldown deines Blink, wenn du Helden triffst. Gegner, die dem Ausbruch zugewandt sind, werden geblendet.","Channel a beam of energy dealing damage over time. Each instance progressively slows until they become rooted.":"Kanalisiere einen Energiestrahl, der Schaden über Zeit verursacht. Jeder Treffer verlangsamt das Ziel zunehmend stärker, bis es mit Root belegt wird.","Phase overcharges herself and her linked ally, granting both increased attack speed, ability haste, and movement speed for a duration.":"Phase lädt sich und ihren verbundenen Verbündeten auf und gewährt beiden für eine Dauer erhöhte Angriffsgeschwindigkeit, Ability Haste und Bewegungstempo.","After casting an ability, restore health over time. Linked allies receive the same healing. Additionally enhances your Blink.":"Nach dem Wirken einer Fähigkeit stellst du über Zeit Gesundheit wieder her. Verbundene Verbündete erhalten dieselbe Heilung. Zusätzlich wird dein Blink verbessert.","Shinyseeker":"Glitzersucher","Roll into action as Maco, a mischevious and adorable Chitterkin with an insatiable desire to collect anything and everything shiny while making friends along the way.":"Rolle ins Geschehen mit Maco, einem schelmischen und niedlichen Chitterkin, der den unstillbaren Drang hat, alles Glänzende zu sammeln, und dabei Freunde findet.","Fling small gemstones at Enemies.":"Schleudere kleine Edelsteine auf Gegner.","Throw a slow, explosive gemstone to damage and Stun Enemies. Can be reactivated early.":"Wirf einen langsamen, explosiven Edelstein, der Gegnern Schaden zufügt und sie mit Stun belegt. Kann vorzeitig reaktiviert werden.","Lob a gemstone that damages Enemies and Heals Allies, additionally granting them Movement Speed.":"Wirf einen Edelstein, der Gegnern Schaden zufügt und Verbündete heilt und ihnen zusätzlich Bewegungstempo gewährt.","Leap high into the air and crush enemies with your giant gem, damaging and Slowing Enemies. Gain a Shield for hitting Enemy Heroes.":"Springe hoch in die Luft und zermalme Gegner mit deinem riesigen Edelstein, verursache Schaden und verlangsame sie. Erhalte einen Shield für Treffer auf gegnerische Helden.","Charge up and send a giant gemstone flying, damaging and Pushing Enemy Heroes. The gemstone then explodes, damaging and Stunning in an area.":"Lade auf und schicke einen riesigen Edelstein auf die Reise, der gegnerischen Helden Schaden zufügt und sie zurückstößt. Der Edelstein explodiert anschließend und verursacht Schaden und Stun in einem Bereich.","Gain Movement Speed while moving, gaining Slow Immunity at max stacks. Stacks removed on being hit by an Enemy Hero.":"Erhalte Bewegungstempo, während du dich bewegst, und werde bei maximalen Stacks immun gegen Slows. Stacks werden entfernt, wenn dich ein gegnerischer Held trifft.","Elanhil Ranger":"Waldläuferin von Elanhil","Let arrows fly with Sparrow, a ranger whose bowmanship pierces through enemy defences, delivering a flurry of feathered death from afar.":"Lass mit Sparrow die Pfeile fliegen, einer Waldläuferin, deren Bogenkunst gegnerische Verteidigungen durchdringt und aus der Ferne einen Hagel gefiederten Todes entfesselt.","Fire precision arrows at your enemies with your bow, Heartpiercer.":"Feuere mit deinem Bogen Heartpiercer Präzisionspfeile auf deine Feinde.","Charge a long range terrain piercing arrow that deals damage to all enemies in its path.":"Lade einen weitreichenden, geländedurchdringenden Pfeil auf, der allen Gegnern in seinem Weg Schaden zufügt.","Release a storm of arrows that rain down, dealing damage and slowing all enemies in the area.":"Entfessle einen Pfeilsturm, der herabregnet, Schaden verursacht und alle Gegner im Bereich verlangsamt.","Vanish from view, becoming Stealthed temporarily. Upon reappearing, become empowered, gaining attack speed and enhancing every second basic attack against the same target to deal increased damage.":"Verschwinde aus dem Blickfeld und gehe kurzzeitig in den Stealth. Beim Wiederauftauchen wirst du verstärkt, erhältst Angriffsgeschwindigkeit, und jeder zweite Standardangriff gegen dasselbe Ziel verursacht erhöhten Schaden.","Invoke your blazing spirit, augmenting Heartpiercer to release a fan of piercing arrows over a short duration.":"Rufe deinen lodernden Geist an und verstärke Heartpiercer, sodass er über kurze Zeit einen Fächer durchschlagender Pfeile abfeuert.","Dealing damage applies stacks of Relentless to enemy targets. Deal additional damage to enemies with Relentless stacks.":"Das Verursachen von Schaden belegt gegnerische Ziele mit Stacks von Relentless. Gegner mit Relentless-Stacks erleiden zusätzlichen Schaden.","Jade Serpent":"Jadeschlange","Yin is a nimble short range carry who dances through battles with her enchanted whip. She weaves a whirlwind of attacks, controlling the flow of combat with swift strikes and fluid movement.":"Yin ist eine wendige Carry mit kurzer Reichweite, die mit ihrer verzauberten Peitsche durch Kämpfe tanzt. Sie webt einen Wirbelsturm aus Angriffen und kontrolliert den Kampffluss mit schnellen Schlägen und fließenden Bewegungen.","Your whip sings through the air, a graceful extension of your will, striking with honed precision.":"Deine Peitsche singt durch die Luft, eine anmutige Verlängerung deines Willens, und trifft mit geschliffener Präzision.","Master the art of deflection by redirecting enemy projectiles and dealing damage to nearby enemies that pushes them back.":"Meistere die Kunst der Abwehr, indem du gegnerische Projektile umlenkst und nahen Gegnern Schaden zufügst, wodurch sie zurückgestoßen werden.","With a flick, your whip becomes a tether, propelling you towards an enemy target or terrain.":"Mit einem Peitschenhieb wird deine Peitsche zum Haltestrick und zieht dich zu einem gegnerischen Ziel oder einer Geländestruktur.","Channel the wind's fury, extending your whip's reach and gaining the ability to cleave through multiple enemies with increased force.":"Kanalisiere die Wut des Windes, vergrößere die Reichweite deiner Peitsche und durchtrenne mit mehr Wucht mehrere Gegner auf einmal.","Summon a raging vortex that ensnares and halts enemy projectiles, slows them down and grants you increased movement speed.":"Beschwöre einen tobenden Wirbel, der gegnerische Projektile einfängt und aufhält, sie verlangsamt und dir erhöhtes Bewegungstempo verleiht.","Dealing damage builds up stacking attack speed. Go too long without dealing damage and this effect ends.":"Schaden zu verursachen baut stapelbare Angriffsgeschwindigkeit auf. Wenn du zu lange keinen Schaden verursachst, endet dieser Effekt.","Reaper":"Schnitter","Command souls with Sevarog, a soul-stacking tank whose syphoning strikes empower him, casting a dark pall over the frontlines.":"Befehlige die Seelen mit Sevarog, einem seelensammelnden Tank, dessen saugende Schläge ihn stärken und einen düsteren Schleier über die Frontlinie legen.","Beat your enemies into submission with The Harbinger":"Schlage deine Gegner mit dem Harbinger zur Unterwerfung.","Dash forward, gliding through any Enemies in your path, dealing damage and causing targets hit to run away in fear.":"Stürme nach vorn und gleite durch alle Gegner in deinem Weg, verursache Schaden und lass getroffene Ziele panisch davonlaufen.","Strike forward with a spectral hand, dealing damage and temporarily stealing Maximum Health from Enemy Heroes":"Stoße mit einer Geisterhand nach vorn, verursache Schaden und stiehl vorübergehend maximale Gesundheit von gegnerischen Helden.","Call down a miasma of dark energy, dealing damage and chaining enemies to the centre. Chained targets that move away from the centre break the chain, damaging and stunning them.":"Lass einen Miasma aus dunkler Energie niedergehen, der Schaden verursacht und Gegner zur Mitte kettet. Angekettete Ziele, die sich von der Mitte entfernen, brechen die Kette, wodurch sie Schaden erleiden und betäubt werden.","Deliver a heavy blow from The Harbinger, dealing damage and sending all enemies flying.":"Verpasse einen schweren Schlag mit dem Harbinger, der Schaden verursacht und alle Gegner durch die Luft schleudert.","Gains Souls when killing enemies with abilities. Each Soul grants bonus health, and Sevarog gains new effects after set amounts are gained.":"Erhält Seelen, wenn er Gegner mit Fähigkeiten tötet. Jede Seele gewährt bonus Gesundheit, und Sevarog erhält neue Effekte, sobald bestimmte Mengen erreicht sind.","Wardrummer":"Kriegstrommler","Drum up support with Narbash, a tanky support whose rhythmic drums invigorate allies, disrupt foes, and turn the tide with the beat of war.":"Trommle Unterstützung zusammen mit Narbash, einem robusten Support, dessen rhythmische Trommeln Verbündete beleben, Feinde behindern und mit dem Takt des Krieges das Blatt wenden.","Beat your opponents like a drum with your Drumclubs.":"Schlage deine Gegner mit deinen Trommelkeulen wie eine Trommel.","Toss a Drumclub that damages and stuns enemies in a tiny area around the target.":"Wirf eine Trommelkeule, die Gegner in einem winzigen Bereich um das Ziel beschädigt und stunt.","Bellow out a rallying war cry, bolstering Song Of My People for a duration.":"Brülle einen aufrüttelnden Schlachtruf heraus, der Song Of My People für eine Dauer verstärkt.","Toggle: Play a soothing beat to either heal, or grant increased movement speed, to yourself and nearby Allies.":"Umschalten: Spiele einen beruhigenden Beat, der dich und nahe Verbündete entweder heilt oder ihnen erhöhtes Bewegungstempo verleiht.","Channel a drum solo over a short duration that slows nearby enemies, before mesmerizing them. The final beat of the solo deals increased damage, knocking up and stunning targets hit.":"Kanalisiere über kurze Zeit ein Trommelsolo, das nahe Gegner verlangsamt und anschließend mesmerisiert. Der letzte Schlag des Solos verursacht erhöhten Schaden, schleudert getroffene Ziele in die Luft (Knock-up) und stunt sie.","Gain increased physical power and armors for each nearby Hero.":"Erhalte für jeden nahen Helden erhöhte physische Kraft und Rüstungen.","Hand of Aresium":"Hand von Aresium","Gun down enemy hostiles with your highly precise K-75 Storm Rifle.":"Schieße feindliche Gegner mit deinem hochpräzisen K-75 Storm Rifle nieder.","Cook and lob a Grenade dealing damage to enemies and launching you upwards. If held for full duration the Grenade explodes in your hand.":"Entsichere und wirf eine Granate, die Gegnern Schaden zufügt und dich nach oben katapultiert. Wird sie die volle Dauer gehalten, explodiert die Granate in deiner Hand.","Launch an Energy Rocket that clusters into Mines on impact that deal damage and slow.":"Feuere eine Energierakete ab, die sich beim Aufprall in Minen aufspaltet, welche Schaden verursachen und verlangsamen.","Place a Standard and gain unstoppable for a short duration and knocking back enemies hit. Allies near the Standard gain movement speed and heal, whilst you gain infinite ammo.":"Platziere ein Banner und erhalte für kurze Zeit Unaufhaltsamkeit, während getroffene Gegner zurückgestoßen werden. Verbündete in der Nähe des Banners erhalten Bewegungstempo und werden geheilt, während du unendlich Munition erhältst.","Throw a Designator, after a short delay a Beam will blast the targeted location, following enemies.":"Wirf einen Designator; nach kurzer Verzögerung beschießt ein Strahl die markierte Stelle und folgt dabei Gegnern.","Convert Attack Speed into Ability Haste and enhance your abilities based on purchased stats.":"Wandle Angriffsgeschwindigkeit in Ability Haste um und verbessere deine Fähigkeiten basierend auf gekauften Werten.","Unchained":"Entfesselt","Pulverise your enemies with your primal fists.":"Zermalme deine Gegner mit deinen urtümlichen Fäusten.","Leap forward before slamming down to the ground, dealing damage.\n\nWhile in Behemoth: Increase the leap range.":"Springe nach vorn und schlage auf den Boden, wobei Schaden verursacht wird.\n\nIn Behemoth-Form: Erhöht die Sprungreichweite.","Rip a boulder from the ground. Throw the boulder, dealing damage and stunning all enemies in its path,\n\nWhile in Behemoth: Throw the boulder instantly.":"Reiße einen Felsbrocken aus dem Boden. Wirf den Felsbrocken, verursache Schaden und stune alle Gegner auf seinem Weg.\n\nIn Behemoth-Form: Wirf den Felsbrocken sofort.","Pound the ground with each fist, dealing damage and slowing enemies.\n\nWhile in Behemoth: Cooldown is significantly reduced.":"Schlage mit jeder Faust auf den Boden, verursache Schaden und verlangsame Gegner.\n\nIn Behemoth-Form: Der Cooldown ist deutlich verringert.","Become enraged, growing in size, gaining health, and empowering your abilities for a duration.":"Werde wütend, wachse an Größe, erhalte Gesundheit und verstärke für eine Dauer deine Fähigkeiten.","Gain health regeneration that is increased while in the Jungle. Being immobilised restores health and grants tenacity.":"Erhalte Gesundheitsregeneration, die im Jungle erhöht ist. Wenn du bewegungsunfähig gemacht wirst, stellst du Gesundheit wieder her und erhältst Zähigkeit.","Zero-Day Dream":"Zero-Day-Traum","Take center stage as Neon, a high-octane technomancer fueled by momentum. Harness the flow of the fight to chain precise combos and execute explosive, all-in plays.":"Betritt als Neon die Bühne, ein hochoktaniger Technomancer, der von Schwung angetrieben wird. Nutze den Fluss des Kampfes, um präzise Kombos aneinanderzureihen und explosive All-in-Plays auszuführen.","Fire Energy bolts at your enemies.":"Feuere Energiegeschosse auf deine Gegner.","Dissolve into a data stream and dash, leaving fading holographic copies in your path. Your next Jolt explodes, damaging and slowing enemies.":"Löse dich in einen Datenstrom auf und dashe, wobei du verblassende holografische Kopien auf deinem Weg hinterlässt. Dein nächster Jolt explodiert, verursacht Schaden und verlangsamt Gegner.","Release a Data Construct that shears through enemies in its path. It returns to your location, dealing True Damage on the recall.":"Entfessle ein Data Construct, das Gegner auf seinem Weg zerschneidet. Es kehrt zu deiner Position zurück und verursacht beim Rückruf True Damage.","Launch a volatile data cluster that detonates on impact, damaging and slowing enemies caught in the blast radius.":"Schieße einen instabilen Datencluster ab, der beim Aufprall detoniert und Gegner im Explosionsradius beschädigt und verlangsamt.","Push your systems beyond their limits, entering a state of hyper-mobility where every ability is permanently Overclocked. You may end the protocol early to launch an explosive finisher.":"Treibe deine Systeme über ihre Grenzen hinaus und tritt in einen Zustand der Hypermobilität ein, in dem jede Fähigkeit dauerhaft übertaktet (Overclocked) ist. Du kannst das Protokoll vorzeitig beenden, um einen explosiven Finisher zu starten.","Weave your spells to generate Threads. Once complete, your system Overclocks, empowering your next basic ability.":"Webe deine Zauber, um Threads zu erzeugen. Sobald sie vollständig sind, wird dein System übertaktet (Overclock) und verstärkt deine nächste Basisfähigkeit.","Ashlar Prince":"Prinz von Ashlar","Stand unyielding as Greystone, a formidable fighter who, with his sword and shield, can rise again after defeat, returning to the fray stronger than before.":"Steh unbeugsam als Greystone, ein beeindruckender Kämpfer, der mit Schwert und Schild nach seiner Niederlage wieder aufstehen und stärker als zuvor in den Kampf zurückkehren kann.","Cleave through enemies with your sword, Lightbringer.":"Durchtrenne Gegner mit deinem Schwert Lightbringer.","Leap forward, dealing damage upon landing.":"Springe nach vorn und verursache bei der Landung Schaden.","Surround yourself in a fiery whirlwind that deals damage.":"Hülle dich in einen feurigen Wirbelwind, der Schaden verursacht.","Bathe your sword in holy fire to enhance your next basic attack to deal extra damage and slow enemies.":"Tauche dein Schwert in heiliges Feuer, damit dein nächster Standardangriff zusätzlichen Schaden verursacht und Gegner verlangsamt.","Enter Stasis and restore health while slowing enemies. Then, crash down, dealing massive damage to enemies.":"Tritt in Stasis ein und stelle Gesundheit wieder her, während du Gegner verlangsamst. Stürze dann herab und verursache bei Gegnern massiven Schaden.","Periodically deflect incoming basic attacks. Regenerate health and gain armor as you lose health.":"Wehrt in regelmäßigen Abständen eingehende Standardangriffe ab. Regeneriere Gesundheit und erhalte Rüstung, während du Gesundheit verlierst.","The Betrayer":"Der Verräter","Carve through Enemies with your massive sword.":"Durchtrenne Gegner mit deinem gewaltigen Schwert.","Smash your Enemies with a brutal slam, shattering their Armor.":"Zerschmettere deine Gegner mit einem brutalen Schlag und zerstöre ihre Rüstung.","Pierce Enemies with slashes of cursed energy.":"Durchbohre Gegner mit Hieben verfluchter Energie.","Howl a battle cry, intimidating your Enemies and growing stronger.":"Heule einen Schlachtruf, der deine Gegner einschüchtert und dich stärker werden lässt.","Dash forward, launching the first enemy Hero hit into the air before you relentlessly slice them to pieces.":"Stürme nach vorn, schleudere den ersten getroffenen gegnerischen Helden in die Luft und zerteile ihn dann unbarmherzig in Stücke.","Go berserk after tanking numerous blows, gaining a surge of power to fight back.":"Verfalle in Raserei, nachdem du zahlreiche Schläge eingesteckt hast, und erhalte einen Kraftschub, um zurückzuschlagen.","Ancient Hunter":"Uralter Jäger","Boris is a menacing diver that installs fear into his foes, hunting them down at distance with his extreme speed. Once near, utilize his mechanized claws to tear through opponents and slam them into the ground.":"Boris ist ein bedrohlicher Diver, der seinen Feinden Furcht einflößt und sie mit seiner extremen Geschwindigkeit über Distanz jagt. Sobald er nah ist, zerreißt er Gegner mit seinen mechanisierten Klauen und schmettert sie zu Boden.","Maul your foes with your mechanized Claws.":"Zerfleische deine Feinde mit deinen mechanisierten Klauen.","Lunge forward and swipe all Enemies in your path twice.":"Stürze dich nach vorn und schlage zweimal alle Gegner in deinem Weg.","Sniff the air, marking an enemy hero and generating a movement enhancing Scent Trail to them. Damaging the marked target slows them and grants you a Canister.":"Schnuppere in der Luft, markiere einen gegnerischen Helden und erzeuge eine Duftspur, die dein Bewegungstempo erhöht und zu ihm führt. Wenn du das markierte Ziel beschädigst, wird es verlangsamt und du erhältst einen Kanister.","Generate a defensive barrier, granting you damage reduction. After the duration or upon reactivation, it explodes, damaging and causing all nearby enemies to run away in fear.":"Erzeuge eine Schutzbarriere, die dir Schadensreduzierung verleiht. Nach Ablauf der Dauer oder bei erneuter Aktivierung explodiert sie, verursacht Schaden und lässt alle nahen Gegner in Furcht davonlaufen.","Dash forward, grabbing the first enemy hero you collide with. Then leap into the air and slam them into the ground, damaging and slowing all enemies in the landing zone.":"Stürme nach vorn und packe den ersten gegnerischen Helden, mit dem du zusammenstößt. Springe dann in die Luft und schmettere ihn zu Boden, wodurch alle Gegner in der Landezone Schaden erleiden und verlangsamt werden.","Every second basic attack on-hit generates a Canister. Canisters give bonus attack speed and healing on-hit. At max Canisters, unleash your Tesseract Core, gaining additional on-hit damage and healing.":"Jeder zweite Standardangriff erzeugt beim Treffer einen Kanister. Kanister verleihen bonus Angriffsgeschwindigkeit und Heilung beim Treffer. Bei maximaler Kanisterzahl entfesselst du deinen Tesseract-Kern und erhältst zusätzlichen Schaden und Heilung beim Treffer.","Queen of Thorns":"Königin der Dornen","Slash through Enemies with your thorn covered sword Acacia.":"Schlitze Gegner mit deinem dornenbewehrten Schwert Acacia auf.","Unfurl your Sword in a long line, dealing True Damage to all Enemies it passes through. Hitting an Enemy Hero or Monster Roots them and causes you to dash to the furthest target hit.":"Entfalte dein Schwert zu einer langen Linie, die allen Gegnern, durch die sie verläuft, True Damage zufügt. Wenn du einen gegnerischen Helden oder ein Monster triffst, wird es festgesetzt (Root) und du dashst zum am weitesten entfernten getroffenen Ziel.","Spin twice slashing your sword, dealing damage, gaining Movement Speed and Mesmerizing nearby Enemies. \nThen slam the ground, dealing True Damage.":"Drehe dich zweimal und schlage mit deinem Schwert zu, verursache Schaden, erhalte Bewegungstempo und mesmerisiere nahe Gegner. \nSchlage dann auf den Boden und verursache True Damage.","Summon your shield and a barrier, increasing your hitbox and gaining Damage Reduction. Simultaneously attach Vines to nearby Enemies, dealing True Damage over time.":"Beschwöre dein Schild und eine Barriere, die deine Hitbox vergrößern und dir Schadensreduzierung verleihen. Befestige gleichzeitig Ranken an nahen Gegnern, die über Zeit True Damage verursachen.","Leap up and slam shield down, summoning a massive Thornbush, Rooting, interrupting, and pulling down Enemies caught in the centre. The Thornbush Slows Enemies and deals True Damage whenever they move inside it.":"Springe hoch und schmettere dein Schild nieder, wodurch ein gewaltiger Dornenbusch erscheint, der Gegner in der Mitte festsetzt (Root), unterbricht und zu Boden zieht. Der Dornenbusch verlangsamt Gegner und verursacht True Damage, wann immer sie sich darin bewegen.","Damaging Enemy Heroes applies Thorns. Allies damaging afflicted Enemies deal a portion of their damage as bonus True Damage.":"Schaden an gegnerischen Helden wendet Dornen an. Verbündete, die betroffene Gegner beschädigen, verursachen einen Teil ihres Schadens als zusätzlichen True Damage.","Imperial Hand":"Hand des Imperiums","Wield ancient techniques as Feng Mao, a melee fighter whose precise, whirlwind strikes and teleportation skills cut through the chaos of combat.":"Setze uralte Techniken ein als Feng Mao, ein Nahkämpfer, dessen präzise Wirbelangriffe und Teleportationsfähigkeiten das Chaos des Kampfes durchschneiden.","Slice through enemies with your glaive, Windwalker.":"Zerschneide Gegner mit deiner Glefe Windwalker.","Teleport forward, dealing damage to everything in your path.":"Teleportiere dich nach vorn und verursache allem auf deinem Weg Schaden.","Envelop yourself with a Spellshield that blocks the next ability hit and grants you additional power and movement speed.":"Hülle dich in einen Zauberschild (Spellshield), der den nächsten Fähigkeitstreffer blockt und dir zusätzliche Kraft und Bewegungstempo verleiht.","Spin twice, dealing damage and slowing all enemies around you. Isolated targets take more damage.":"Drehe dich zweimal, verursache Schaden und verlangsame alle Gegner um dich herum. Isolierte Ziele erleiden mehr Schaden.","Slam the ground, causing massive spikes to rise up. This deals damage and executes any enemy below the threshold.":"Schlage auf den Boden, sodass gewaltige Stacheln emporschießen. Das verursacht Schaden und richtet jeden Gegner unterhalb der Schwelle hin.","Unique Hero Takedowns permanently grant physical penetration.":"Einzigartige Helden-Takedowns gewähren dauerhaft physische Durchdringung.","Eternal Sentinel":"Ewiger Wächter","Dominate the fight with high-octane aggression. Switch from a bullet hell repeater to brutal plasma claws, building Heat to unleash an apocalyptic Limit Break.":"Beherrsche den Kampf mit hochoktaniger Aggression. Wechsle von einem Kugelhagel-Repetierer zu brutalen Plasmaklauen und baue Hitze auf, um einen apokalyptischen Limit Break zu entfesseln.","Fire a fully automatic barrage with your ranged basic attack or unleash a rapid four-hit light attack chain, culminating in a powerful heavy-hitting finisher.":"Feuere mit deinem Fernkampf-Standardangriff ein vollautomatisches Sperrfeuer ab oder entfessle eine schnelle Kette aus vier leichten Treffern, die in einem kraftvollen, schwer treffenden Finisher gipfelt.","Ranged: Thrust upwards and empower your next basic attack to fire an explosive Railshot.\n\nMelee: Dash to a Target enemy and unleash a powerful uppercut.":"Fernkampf: Stoße dich nach oben ab und verstärke deinen nächsten Standardangriff, sodass er einen explosiven Railshot abfeuert.\n\nNahkampf: Dashe zu einem anvisierten Gegner und entfessle einen kraftvollen Aufwärtshaken.","Ranged: Fire a laser that pierces through all enemies in its path.\n\nMelee: Spin 4 times with your claws, then unleash a slowing lightning strike forward.":"Fernkampf: Feuere einen Laser ab, der alle Gegner auf seinem Weg durchbohrt.\n\nNahkampf: Drehe dich viermal mit deinen Klauen und entfessle dann einen verlangsamenden Blitzschlag nach vorn.","Switch between Ranged and Melee stances, changing your abilities.\nGaining bonus Physical Power in Ranged stance and Healing when damaging enemy Heroes in Melee stance.":"Wechsle zwischen Fernkampf- und Nahkampf-Haltung, wodurch sich deine Fähigkeiten ändern.\nIn der Fernkampf-Haltung erhältst du bonus physische Kraft, in der Nahkampf-Haltung wirst du geheilt, wenn du gegnerischen Helden Schaden zufügst.","Ranged: Fly upwards and bombard a Target area with four energy beams.\n\nMelee: Teleport to a location and unleash a mobile flurry of strikes, culminating in a devastating finisher from above.":"Fernkampf: Fliege nach oben und bombardiere ein anvisiertes Gebiet mit vier Energiestrahlen.\n\nNahkampf: Teleportiere dich zu einer Stelle und entfessle ein bewegliches Schlaggewitter, das in einem verheerenden Finisher von oben gipfelt.","Damage enemy Heroes to build Heat. Upon reaching max Heat, you may activate a Limit Break ability.":"Füge gegnerischen Helden Schaden zu, um Hitze aufzubauen. Bei maximaler Hitze kannst du eine Limit-Break-Fähigkeit aktivieren.","Forsaken Warlord":"Verstoßener Kriegsherr","Crush resistance with Grux, a powerful melee fighter whose ruthless attacks shred enemies, priming them for the kill.":"Zermalme Widerstand mit Grux, einem mächtigen Nahkämpfer, dessen gnadenlose Angriffe Gegner zerfetzen und sie für den Todesstoß vorbereiten.","Use the Chieftains Warclubs to pulverise your enemies.":"Zermalme deine Gegner mit den Kriegskeulen des Häuptlings.","Using the Chieftains Clubs cleave all enemies dealing damage.":"Durchtrenne mit den Keulen des Häuptlings alle Gegner und verursache Schaden.","Smash the ground, sending forth a shockwave that pulls all enemies towards you, dealing damage and stunning.":"Schlage auf den Boden und sende eine Schockwelle aus, die alle Gegner zu dir zieht, Schaden verursacht und stunt.","After a short delay, dash forward a long distance. Enemies passed through are damaged, slowed, and dragging Enemy Heroes along with Grux.":"Dashe nach kurzer Verzögerung weit nach vorn. Durchquerte Gegner erleiden Schaden und werden verlangsamt, und gegnerische Helden werden von Grux mitgeschleift.","Slam your clubs together stunning all nearby enemies. Gain attack speed and steal power from those you hit for a duration.":"Schlage deine Keulen zusammen und stune alle nahen Gegner. Erhalte für eine Dauer Angriffsgeschwindigkeit und stiehl Kraft von getroffenen Zielen.","Your basic attacks bleed enemies, dealing damage over time.":"Deine Standardangriffe lassen Gegner bluten und verursachen Schaden über Zeit.","The Luminary":"Die Leuchtende","Charm the crowd with Shinbi, a pop star whose melodic moves summon spirit wolves that dance to her tune, cutting through the heart of the battle.":"Verzaubere die Menge mit Shinbi, einem Popstar, dessen melodische Bewegungen Geisterwölfe beschwören, die nach ihrer Melodie tanzen und sich durch das Herz der Schlacht schneiden.","Dice up your enemies with your sword.":"Zerhacke deine Gegner mit deinem Schwert.","Dash forward, dealing damage to all enemies you pass through.":"Dashe nach vorn und verursache allen Gegnern, durch die du hindurchgehst, Schaden.","Summon a spirit wolf that runs in a straight line and passes through all enemies, dealing damage.":"Beschwöre einen Geisterwolf, der geradeaus rennt, alle Gegner durchquert und Schaden verursacht.","Summon spirit wolves that circle you, granting movement speed and a shield for a duration. The wolves deal damage to nearby enemies.":"Beschwöre Geisterwölfe, die dich umkreisen und dir für eine Dauer Bewegungstempo und einen Shield verleihen. Die Wölfe fügen nahen Gegnern Schaden zu.","Passive: Damaging Enemy Heroes with abilities marks them and grants stacks of Track for a duration. At maximum stacks, you may activate All-Kill.\nActive: Summon a pack of spirit wolves above marked Heroes that strike them, dealing damage with each hit.":"Passiv: Wenn du gegnerischen Helden mit Fähigkeiten Schaden zufügst, werden sie markiert und du erhältst für eine Dauer Stapel von Track. Bei maximalen Stapeln kannst du All-Kill aktivieren.\nAktiv: Beschwöre ein Rudel Geisterwölfe über markierten Helden, die sie angreifen und mit jedem Treffer Schaden verursachen.","Basic attacks deal additional damage. Periodically this effect deals even more damage and restores mana.":"Standardangriffe verursachen zusätzlichen Schaden. In regelmäßigen Abständen verursacht dieser Effekt noch mehr Schaden und stellt Mana wieder her.","Pursuer":"Verfolger","Snipe your enemies with pinpoint precision with The Neutralizer.":"Schieße deine Gegner mit dem Neutralizer mit pinpunktgenauer Präzision ab.","Fire a sniper shot that deals high damage. If this ability hits a marked target, deal extra damage and reduce the cooldown.":"Gib einen Scharfschützenschuss ab, der hohen Schaden verursacht. Wenn diese Fähigkeit ein markiertes Ziel trifft, verursacht sie zusätzlichen Schaden und verringert den Cooldown.","Launch a piercing Nanite Grenade that deals damage, slows, and marks everything hit.":"Feuere eine durchschlagende Nanite-Granate ab, die Schaden verursacht, verlangsamt und alles Getroffene markiert.","Enter Camouflage and gain movement speed. Takedowns will reset the cooldown of Surprise.":"Aktiviere Tarnung und erhalte Bewegungstempo. Takedowns setzen den Cooldown von Surprise zurück.","Choose a nearby enemy hero and mark their location from 2s prior. After a delay they will teleport back to this location.":"Wähle einen nahen gegnerischen Helden und markiere seinen Standort von vor 2 Sek. Nach einer Verzögerung wird er an diesen Ort zurückteleportiert.","Your Vision Item becomes a Sonar Drone that when launched will scan the surrounding area,":"Dein Vision-Gegenstand wird zu einer Sonar-Drohne, die beim Start die Umgebung scannt,","Executioner":"Scharfrichter","Strike from the shadows with Kallari, a stealthy assassin whose lethal precision and invisibility spells doom for the unwary.":"Schlage aus den Schatten zu mit Kallari, einer verstohlenen Assassine, deren tödliche Präzision und Unsichtbarkeit den Unvorsichtigen den Untergang bringen.","Unleash razor sharp attacks with your ultralight Plasteel Swords.":"Entfessle messerscharfe Angriffe mit deinen ultraleichten Plasteel-Schwertern.","Throw a dagger, dealing damage slowing enemies. Max Charges: 2.":"Wirf einen Dolch, der Schaden verursacht und Gegner verlangsamt. Max. Aufladungen: 2.","Gain Health Regeneration out of vision. Activate to enter Camouflage and gain movement speed.":"Erhalte Lebensregeneration, solange du außer Sicht bist. Aktiviere, um in Tarnung zu gehen und Bewegungstempo zu erhalten.","Backflip into the sky, allowing you to dash at a target enemy and deal damage, increasing if they're affected by Death Mark.":"Mache einen Rückwärtssalto in die Luft und dashe auf einen gegnerischen Helden zu, um Schaden zu verursachen, der erhöht wird, wenn er von Death Mark betroffen ist.","Dash forward, cutting through all Enemies in your path, dealing massive damage.":"Dashe nach vorn, durchschneide alle Gegner auf deinem Weg und verursache massiven Schaden.","Damaging enemies reveals them and deals damage after a delay. Additionally, Kallari can jump multiple times.":"Gegner, denen du Schaden zufügst, werden aufgedeckt und erleiden nach einer Verzögerung Schaden. Zusätzlich kann Kallari mehrfach springen.","Cursebreaker":"Fluchbrecherin","Protect the land as Scarlett, a noble woman of pure heart who seeks the cure for the curse of lycanthropy. Wielding the Crimson Flame, Scarlett strikes true with precise rapier strikes and heavy lantern blows, subduing her foes with fiery grace.":"Beschütze das Land als Scarlett, eine edle Frau mit reinem Herzen, die nach einem Heilmittel gegen den Fluch der Lykanthropie sucht. Mit der Crimson Flame trifft Scarlett mit präzisen Degenstichen und wuchtigen Laternenschlägen, und bezwingt ihre Feinde mit feuriger Anmut.","Slice through your Enemies with your fiery Blade.":"Durchtrenne deine Gegner mit deiner feurigen Klinge.","Twirl fiercely, then unleash a series of damaging stabs, with the final stab dealing bonus damage based on the Enemy's Missing Health.":"Wirbele ungestüm herum und entfessle dann eine Serie schadensverursachender Stiche, wobei der letzte Stich zusätzlichen Schaden basierend auf dem fehlenden Leben des Gegners verursacht.","Swing your lantern around you dealing Damage. If the Outer Edge hits Enemies it deals more Damage and slows them, and empowers your next Cindara attack if it hits a Hero or Camp Leader.":"Schwinge deine Laterne um dich herum und verursache Schaden. Trifft der äußere Rand Gegner, verursacht er mehr Schaden und verlangsamt sie, und verstärkt deinen nächsten Cindara-Angriff, wenn dieser einen Helden oder Camp-Anführer trifft.","Rapidly dash forward, with a decisive fiery strike. Damages all Enemies hit. Restore Energy and gain a larger shield for each Hero or Camp Leader hit.":"Dashe schnell nach vorn mit einem entschlossenen, feurigen Hieb. Verursacht Schaden bei allen getroffenen Gegnern. Stelle Energie wieder her und erhalte für jeden getroffenen Helden oder Camp-Anführer einen größeren Shield.","Wrap your Lantern around an Enemy Hero, Restraining them and Slowing Enemies around them. After Restraining them, strike down dealing Damage to Enemies around you and set your Rapier Ablaze, empowering your abilities and gaining basic attack range.":"Wickle deine Laterne um einen gegnerischen Helden, fessele ihn und verlangsame Gegner in seiner Nähe. Nach dem Fesseln schlägst du zu, verursachst Schaden bei Gegnern um dich herum und setzt dein Rapier in Brand, wodurch deine Fähigkeiten verstärkt werden und du Reichweite für Standardangriffe erhältst.","Use Energy instead of Mana, convert Bonus Mana into Physical Power.":"Nutze Energie statt Mana und wandle Bonus-Mana in physische Kraft um.","Watchman":"Wächter","Enforce justice with Murdock, a ranger whose long-range shots and traps bring law and order to any who challenge his authority.":"Sorge für Gerechtigkeit mit Murdock, einem Waldläufer, dessen Fernschüsse und Fallen allen Recht und Ordnung bringen, die seine Autorität in Frage stellen.","Bombard your enemies with bullets from your hip fired rifle, The Enforcer.":"Bombardiere deine Gegner mit Kugeln aus deinem Hüftanschlag-Gewehr, dem Enforcer.","Discharge a shotgun blast, dealing more damage the closer the enemy is and reducing their armour. The blast pushes enemies back.":"Feuere eine Schrotflintensalve ab, die umso mehr Schaden verursacht, je näher der Gegner ist, und seine Rüstung verringert. Die Salve stößt Gegner zurück.","Place an energy trap that deals damage and roots enemy heroes.":"Platziere eine Energiefalle, die Schaden verursacht und gegnerische Helden festsetzt (Root).","Activate your sirens, gaining movement speed and attack speed.":"Aktiviere deine Sirenen und erhalte Bewegungstempo und Angriffsgeschwindigkeit.","Kneel and prepare an energised sniper shot with unlimited range that can travel through anything. This shot deals massive damage.":"Gehe in die Knie und bereite einen energiegeladenen Scharfschützenschuss mit unbegrenzter Reichweite vor, der alles durchdringen kann. Dieser Schuss verursacht massiven Schaden.","Periodically, your next basic attack has increased range and deals more damage.":"Dein nächster Standardangriff hat in regelmäßigen Abständen eine erhöhte Reichweite und verursacht mehr Schaden.","Rift Walker":"Rissschreiter","Warp reality with Gideon, a mage whose cosmic abilities tear apart the battlefield, summoning meteor showers and black holes to overwhelm his adversaries.":"Verbiege die Realität mit Gideon, einem Magier, dessen kosmische Fähigkeiten das Schlachtfeld zerreißen und mit Meteorschauern und schwarzen Löchern seine Widersacher überwältigen.","Fire rift bolts at your enemies.":"Feuere Risspfeile auf deine Gegner ab.","Launch forward a comet, dealing damage and slowing enemies in its path.":"Schicke einen Kometen nach vorn, der Schaden verursacht und Gegner auf seinem Weg verlangsamt.","Rip down a meteor from the sky, dealing damage to enemies caught in the area of impact.":"Reiße einen Meteor vom Himmel, der Gegnern im Einschlagsbereich Schaden zufügt.","Leap through a portal in spacetime, appearing at the target location.":"Springe durch ein Portal in der Raumzeit und erscheine am Zielort.","Unleash a black hole underneath you that pulls enemies towards the centre, constantly dealing damage.":"Entfessle unter dir ein schwarzes Loch, das Gegner zur Mitte zieht und dabei fortwährend Schaden verursacht.","Damaging a hero with an ability empowers your next basic attack. This attack teathers you to your target, slowing and damaging them.":"Wenn du einen Helden mit einer Fähigkeit beschädigst, wird dein nächster Standardangriff verstärkt. Dieser Angriff bindet dich an dein Ziel, verlangsamt es und fügt ihm Schaden zu.","Sentinel":"Wächterin","Soar into salvation as Muriel, a guardian angel whose protective shields and emergency support provides a beacon of hope, turning the tide of battle with her grace and support.":"Schwinge dich zur Rettung auf als Muriel, ein Schutzengel, dessen schützende Shields und Notfall-Support ein Hoffnungsschimmer sind und mit ihrer Anmut und Unterstützung das Blatt der Schlacht wenden.","Turn your shielding energy offensive with this ranged basic attack.":"Setze deine Schildenergie offensiv ein mit diesem Standardangriff auf Distanz.","Charge up a piercing bolt of energy that damages and slows enemies. Deals increased damage and stuns at full charge.":"Lade einen durchschlagenden Energiepfeil auf, der Gegnern Schaden zufügt und sie verlangsamt. Verursacht bei voller Aufladung mehr Schaden und betäubt (Stun).","Bless a large area, granting attack speed and health regeneration to Allies within. Enemies standing in the zone take damage over time and suffer reduced attack speed.":"Segne ein großes Gebiet und gewähre Verbündeten darin Angriffsgeschwindigkeit und Lebensregeneration. Gegner in der Zone erleiden Schaden über Zeit und haben verringerte Angriffsgeschwindigkeit.","Throw an orb that shields and grants movement speed to yourself or Allied Heroes.":"Wirf eine Kugel, die dich oder verbündete Helden mit einem Shield versieht und ihnen Bewegungstempo verleiht.","Grant an Allied Hero damage reduction and a large shield for a short duration before soaring to their location. On arrival, damage and knock up nearby enemies.":"Gewähre einem verbündeten Helden für kurze Zeit Schadensreduktion und einen großen Shield, bevor du zu seinem Standort fliegst. Bei der Ankunft erleiden nahe Gegner Schaden und werden hochgeschleudert (Knock-up).","Muriel’s abilities apply anti-heal to enemies and grant a buff to Allies that increases the healing and shielding they receive.":"Muriels Fähigkeiten wenden Anti-Heal auf Gegner an und gewähren Verbündeten einen Buff, der die erhaltene Heilung und Shields erhöht.","Electrocutioner":"Elektrokutor","Imprison enemies with Riktor, a hulking tank whose chains bind and brutalise, leaving no room for escape within his iron clutches.":"Sperre Gegner ein mit Riktor, einem riesenhaften Tank, dessen Ketten fesseln und zermalmen und in seinem eisernen Griff keinen Fluchtweg lassen.","Shred your enemies with devastating lashes from your chains.":"Zerfetze deine Gegner mit verheerenden Hieben deiner Ketten.","Launch your chain forward, attaching to the first Enemy hit, dealing damage and pulling them towards you.":"Schleudere deine Kette nach vorn, die sich am ersten getroffenen Gegner festsetzt, Schaden verursacht und ihn zu dir heranzieht.","Swing an electrified whip, removing shields, dealing damage and silencing enemies.":"Schwinge eine elektrisierte Peitsche, die Shields entfernt, Schaden verursacht und Gegner zum Schweigen bringt (Silence).","Emit an electrical aura, granting you a Shield and Movement Speed. The aura deals damage over time to enemies around you.":"Sende eine elektrische Aura aus, die dir einen Shield und Bewegungstempo verleiht. Die Aura verursacht Schaden über Zeit bei Gegnern in deiner Nähe.","Unleash a torrent of chains, dealing damage and suppressing enemies hit. Repeat the damage at the end of the suppression.":"Entfessle einen Kettenhagel, der Schaden verursacht und getroffene Gegner niederhält (Suppress). Der Schaden wird am Ende der Unterdrückung wiederholt.","Applying crowd control short circuits Enemy Heroes, halting their cooldown progression.":"Das Anwenden von Crowd Control sorgt bei gegnerischen Helden für einen Kurzschluss und stoppt den Fortschritt ihrer Cooldowns.","Arbiter of the Deep":"Schiedsrichter der Tiefe","Use your enchanted Trident to shoot streams of water with a high impact.":"Nutze deinen verzauberten Dreizack, um Wasserstrahlen mit hoher Durchschlagskraft abzufeuern.","Fire a rapid Hydroblast that deals damage and pops Bubbles. Killing Enemies with Hydroblast or Bubble pops with Brine generates Gold.":"Feuere einen schnellen Hydroblast ab, der Schaden verursacht und Bubbles platzen lässt. Gegner mit Hydroblast oder durch platzende Bubbles mit Brine zu töten, bringt Gold.","Release a unit piercing Water Sphere that floats towards Enemies dealing Damage and stopping on the first Enemy Hero hit, Suspending them.":"Entlasse eine einheitendurchdringende Wassersphäre, die auf Gegner zuschwebt, Schaden verursacht und beim ersten getroffenen gegnerischen Helden stehen bleibt, wodurch dieser in der Schwebe gehalten wird (Suspend).","Create an Abyssal Bubble at a targeted location. If the Bubble is hit by Brine or your Basic Attack, it pops, dealing damage and refunding mana. The Bubble will amplify after a short duration, dealing increased damage and slowing.":"Erschaffe eine Abyssal Bubble an einem gewählten Ort. Wird die Bubble von Brine oder deinem Standardangriff getroffen, platzt sie, verursacht Schaden und erstattet Mana zurück. Nach kurzer Zeit wird die Bubble verstärkt, verursacht mehr Schaden und verlangsamt.","Rise high into the sky and unleash a disruptive Waterspout that pierces walls. When the Waterspout hits an Enemy, they will be knocked up and slowed upon landing.":"Erhebe dich hoch in den Himmel und entfessle einen störenden Waterspout, der Wände durchdringt. Trifft der Waterspout einen Gegner, wird dieser hochgeschleudert (Knock-up) und beim Landen verlangsamt.","Gain bonus effects based on your selected Eternal, empowering your abilities further.":"Erhalte Bonuseffekte je nach gewähltem Eternal, die deine Fähigkeiten zusätzlich verstärken.","Spirit Hunter":"Geisterjäger","Unleash the beast within as Khaimera, a savage melee jungler whose relentless pounce and rapid attacks tear through those who wander into his domain.":"Entfessle die Bestie in dir als Khaimera, ein wilder Nahkampf-Jungler, dessen unerbittlicher Sprungangriff und schnelle Attacken jeden zerfleischen, der sich in sein Revier verirrt.","Brutalize your foes with your primal twin axes, Rage and Spirit.":"Misshandle deine Feinde mit deinen urtümlichen Zwillingsäxten Rage und Spirit.","Leap to an enemy dealing damage and slowing them.":"Springe auf einen Gegner, verursache Schaden und verlangsame ihn.","Gain an incredible amount of attack speed for a short duration allowing you to tear through enemies.":"Erhalte für kurze Zeit enorme Angriffsgeschwindigkeit, um Gegner zu zerfetzen.","Cleanse all debuffs and receive a burst of healing.":"Entferne alle Debuffs und erhalte einen Heilungsschub.","Unleash a primal roar, slashing all enemies in front of you for heavy damage and stunning them.":"Brülle urgewaltig und schlitze alle Gegner vor dir auf, wodurch sie schweren Schaden erleiden und betäubt werden (Stun).","Dealing damage builds Rage, increasing your Health Regeneration and Cooldown Progression. Maintaining high Rage grants Movement Speed. Go too long without attacking and your Rage decays.":"Schaden zu verursachen baut Rage auf, was deine Lebensregeneration und den Cooldown-Fortschritt erhöht. Hohe Rage verleiht Bewegungstempo. Greifst du zu lange nicht an, verfällt deine Rage.","Fugitive":"Flüchtling","Ignite the battlefield with Starfire's celestial fury.":"Lasse das Schlachtfeld brennen mit dem himmlischen Zorn von Starfire.","Hypercharge Starfire to instead project a beam that deals massive single target damage.":"Überlade Starfire, um stattdessen einen Strahl zu projizieren, der massiven Schaden an einem einzelnen Ziel verursacht.","Launch a sticky grenade that detonates, slowing and damaging enemies.":"Feuere eine klebrige Granate ab, die detoniert, Gegner verlangsamt und ihnen Schaden zufügt.","Launch yourself upwards to fly and launch missiles at targets you damage.":"Schleudere dich nach oben, um zu fliegen, und feuere Raketen auf Ziele ab, denen du Schaden zufügst.","Charge and unleash a nuclear projectile that deals massive damage at long range.":"Lade ein nukleares Geschoss auf und feuere es ab, das auf große Distanz massiven Schaden verursacht.","Jump higher and cause explosions on killing enemies.":"Springe höher und löse beim Töten von Gegnern Explosionen aus.","Lone Guardian":"Einsamer Wächter","Fortify the frontline with Steel, a towering tank that steamrolls through enemy lines.":"Verstärke die Frontlinie mit Steel, einem hünenhaften Tank, der durch die gegnerischen Reihen walzt.","Beat your opponents to a pulp with your heavy hitting fists.":"Prügele deine Gegner mit deinen schwer zuschlagenden Fäusten zu Brei.","Swipe forward dealing damage and stunning all enemies in front of you.":"Schlage nach vorn, verursache Schaden und betäube (Stun) alle Gegner vor dir.","Charge forward, dealing damage and sending enemies flying.":"Stürme nach vorn, verursache Schaden und schleudere Gegner durch die Luft.","Deploy a disruptive wall of energy, blocking all incoming Enemy Projectiles.":"Errichte eine störende Energiewand, die alle eingehenden gegnerischen Projektile blockt.","Leap into the sky and crash down at the target location to deal damage and knock up enemies.":"Springe in den Himmel und schlage am Zielort ein, um Schaden zu verursachen und Gegner hochzuschleudern (Knock-up).","Shield yourself after remaining out of combat for a duration and gain increased defences.":"Erhalte nach einer gewissen Zeit außerhalb des Kampfes einen Shield und erhöhte Verteidigung.","Arcane Engineer":"Arkaner Ingenieur","An arcane engineer hell-bent on technological progress by merging magic with machines, Argus is a deadly Mage who dominates the battlefield with slaughterous spells.":"Argus ist ein arkaner Ingenieur, der wild entschlossen den technologischen Fortschritt vorantreibt, indem er Magie mit Maschinen verbindet. Als tödlicher Magier beherrscht er das Schlachtfeld mit mörderischen Zaubern.","Cast soul bolts with the Arcrune Conduit.":"Wirke Seelenblitze mit dem Arcrune Conduit.","Fire homing projectiles that deal damage from the Arcrune Conduit.":"Feuere zielsuchende Projektile aus dem Arcrune Conduit ab, die Schaden verursachen.","Lob an unstable orb of soul energy that deals damage and stuns.":"Schleudere eine instabile Kugel aus Seelenenergie, die Schaden verursacht und betäubt (Stun).","Summon an Ether Crystal at a target location. The Crystal will push enemies and launch allies. It deals damage and slows.":"Beschwöre einen Ether Crystal an einem Zielort. Der Kristall stößt Gegner zurück und schleudert Verbündete fort. Er verursacht Schaden und verlangsamt.","Charge up the arcrune engine to fire powerful energy beams that deal damage and slow":"Lade den Arcrune-Motor auf, um mächtige Energiestrahlen abzufeuern, die Schaden verursachen und verlangsamen","Your abilities apply a stack of Disintegration causing subsequent abilities to deal extra damage.":"Deine Fähigkeiten fügen einen Stapel Disintegration hinzu, wodurch nachfolgende Fähigkeiten zusätzlichen Schaden verursachen.","Ice Queen":"Eiskönigin","Aurora specialises in bitterly cold crowd control, freezing her opponents in their tracks while dancing around the battlefield with her arctic agility.":"Aurora ist spezialisiert auf bitterkaltes Crowd Control: Sie friert ihre Gegner auf der Stelle ein und tanzt mit ihrer arktischen Agilität über das Schlachtfeld.","Slice through your enemies with your sword, Shatter.":"Durchschneide deine Gegner mit deinem Schwert Shatter.","Summon a wave of frost dealing damage and slowing. The frost then explodes, dealing damage again.":"Beschwöre eine Frostwelle, die Schaden verursacht und verlangsamt. Der Frost explodiert anschließend und verursacht erneut Schaden.","Dash forward and leave behind a trail of ice that increases allied movement speed.":"Dashe nach vorn und hinterlasse eine Eisspur, die das Bewegungstempo von Verbündeten erhöht.","Create a ring of frost that deals damage and roots enemies.":"Erschaffe einen Frostring, der Schaden verursacht und Gegner festsetzt (Root).","Freezes an area slowing enemies. After the slow enemies explode dealing damage and chaining the effect to those hit.":"Friert ein Gebiet ein und verlangsamt Gegner. Nach der Verlangsamung explodieren die Gegner, verursachen Schaden und übertragen den Effekt auf Getroffene.","Jump whilst airborne to leap in the direction of motion, leaving behind a Statue.\n\nDamaging enemies summons a Frost Storm that deals damage.":"Springe in der Luft erneut, um in Bewegungsrichtung zu hechten und eine Statue zu hinterlassen.\n\nGegnern Schaden zuzufügen beschwört einen Frost Storm, der Schaden verursacht.","Monkey King":"Affenkönig","Decieve your opponents with Wukong, a trickster who will leave your oppenents scratching their heads wondering how they lost.":"Täusche deine Gegner mit Wukong, einem Trickser, der deine Widersacher kopfkratzend zurücklässt und sich fragen lässt, wie sie verloren haben.","Beat your opponents senseless with the iconic Gold-Banded Staff.":"Prügele deine Gegner mit dem legendären Gold-Banded Staff windelweich.","Spirit: Dash forward with the wind, dealing damage.\nBody: Force your enemies and clones away and deal damage.":"Spirit: Dashe mit dem Wind nach vorn und verursache Schaden.\nBody: Stoße deine Gegner und Klone weg und verursache Schaden.","Spirit: Create walkable clouds beneath you.\nBody: Leap in a direction and gain Attack Speed.":"Spirit: Erschaffe begehbare Wolken unter dir.\nBody: Springe in eine Richtung und erhalte Angriffsgeschwindigkeit.","Spirit: Gain Damage Reduction and Stun Enemies.\nBody: Slam down dealing more damage based on height.":"Spirit: Erhalte Schadensreduktion und betäube (Stun) Gegner.\nBody: Schlage herab und verursache mehr Schaden je nach Höhe.","Switch between Body and Spirit Stances, changing your basic abilities.":"Wechsle zwischen den Haltungen Body und Spirit, um deine Standardfähigkeiten zu ändern.","Wukong can jump an additional time.":"Wukong kann ein weiteres Mal springen."}};
hydrateEmbeddedAssets(SNAPSHOT);
const ROLES = ['Offlane', 'Jungle', 'Midlane', 'Carry', 'Support'];
const ROLE_LABEL = {Offlane: 'Offlane', Jungle: 'Jungle', Midlane: 'Mid', Carry: 'Carry', Support: 'Support'};
const HEROES = SNAPSHOT.heroes.map(x => ({id: x.s, name: x.n, roles: x.r.filter(r => ROLES.includes(r)), classes: x.c || [], icon: x.i, art: x.a || x.i, cut: x.k || null}))
  .sort((a, b) => a.name.localeCompare(b.name));
const HERO = Object.fromEntries(HEROES.map(x => [x.id, x]));
const SNAP_PATCHES = Object.keys(SNAPSHOT.stats);
const PATCH_NAMES = {'1.17': 'Bloodtide', '1.16': 'Aegis of Dawn', '1.15': 'Splash Damage', '1.14': 'Harbingers of Ruin', '1.13': 'Throne of Thorns'};
/* The roles of a hero come from pred.gg and from nowhere else. An evaluation or a
   rating for any other role is invalid: it is dropped when data is read and is never
   ranked or shown. If pred.gg changes a hero's roles, the snapshot (or a proxy) changes
   HEROES and old entries for a role that no longer exists fall out the same way. */
/* Community ratings are switched off in the interface. The data layer (Ratings, Sync and
   the database rule) is untouched, so setting this to true brings every view back. */
const COMMUNITY = false;
/* GAME DATA (omeda.city): base values of a hero at level 1 and level 18, without items.
   SUGGESTIONS: an estimate for the guided questions, written from ability descriptions,
   base values and pred.gg statistics. Shown to admins only, never ranked or published by
   itself – an admin has to apply and publish it like any other evaluation. */
const BASE = SNAPSHOT.base || {}, SUGGEST = SNAPSHOT.suggest || {};
const suggestion = (id, role) => (SUGGEST[role] || {})[id] || null;
const heroesOfRole = role => HEROES.filter(x => x.roles.includes(role));
const validHeroRole = (id, role) => !!HERO[id] && HERO[id].roles.includes(role);
const heroRoles = id => HERO[id] ? HERO[id].roles : [];

/* Layer B – OUR OFFICIAL DATA: category model, default role weights, tier thresholds. */
const CATS = [
  {id: 'duel', label: '1v1 / Duel', short: '1v1'},
  {id: 'lane', label: 'Lane Pressure', short: 'Lane'},
  {id: 'skirmish', label: 'Skirmish', short: 'Skirmish'},
  {id: 'teamfight', label: 'Teamfight', short: 'Teamfight'},
  {id: 'map', label: 'Map / Rotation', short: 'Map'},
  {id: 'objective', label: 'Objective Impact', short: 'Objective'},
  {id: 'safety', label: 'Safety / Survivability', short: 'Safety'},
  {id: 'utility', label: 'Utility / Control', short: 'Utility'}
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
/* Which categories exist per role is structural, not editable: no Lane for Jungle,
   no 1v1 for Support, Utility for Support only. */
const ROLE_CATS = {
  Offlane: ['duel', 'lane', 'skirmish', 'teamfight', 'map', 'objective', 'safety'],
  Jungle: ['duel', 'skirmish', 'teamfight', 'map', 'objective', 'safety'],

  Support: ['lane', 'skirmish', 'teamfight', 'map', 'objective', 'safety', 'utility']
};
const DEFAULT_WEIGHTS = {
