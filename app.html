<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AXIOM — Predecessor Competitive Intelligence</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
/* ============================== DESIGN TOKENS ==============================
   Liquid iridescence behind editorial silence: the interface is black, white and
   gray only; colour lives in the hero media. Pills are the only rounded controls,
   the hero media panel is the one deliberately soft object. No shadows. */
:root{
  color-scheme:dark;
  --bg:#0b0b0c; --bg-2:#111112; --ink:#ffffff; --ink-2:#d6d6d6; --gray:#9a9a9a; --dim:#6d6d6d;
  --line:rgba(255,255,255,.13); --line-2:rgba(255,255,255,.3); --fill:rgba(55,55,55,.78);
  --gold:#d8c37a;                       /* only for tiny media-derived accents */
  --font:"Inter","Söhne","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --ease:cubic-bezier(.19,1,.22,1); --slow:1.1s; --mid:.8s;
  --pad:clamp(20px,4.4vw,72px); --nav-h:66px; --max:none; --r-pill:75px; --r-media:28px;
}

/* ================================== BASE ================================== */
*{box-sizing:border-box}
html{scroll-behavior:auto}
html{background:var(--bg)}
/* The liquid field is one fixed canvas behind every page; content sits on it without panels. */
canvas.fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block;pointer-events:none}
body.nofx::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 70% 26%,transparent 0 9vh,rgba(255,170,190,.55) 9.2vh,rgba(120,40,70,.25) 10vh,transparent 18vh),linear-gradient(180deg,#03040b 0%,#0b0718 45%,#1b0b1a 66%,#04040a 66.2%,#020205 100%)}
/* The page keeps its own dark background whatever the host document sets. isolation makes
   the body a stacking context, so the canvas (z-index -1) paints above that background and
   below all content. */
body{background:var(--bg);isolation:isolate;min-height:100vh;color:var(--ink);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
::selection{background:#fff;color:#000}
h1,h2,h3,p{margin:0}
ul{list-style:none;margin:0;padding:0}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--pad)}
.page{padding-top:calc(var(--nav-h) + clamp(40px,8vw,120px));padding-bottom:140px;animation:enter var(--slow) var(--ease) both}
.page.flush{padding-top:12px}
@keyframes enter{from{opacity:0;transform:translateY(18px)}}
.micro{font-size:11px;line-height:1.3;letter-spacing:.16em;text-transform:uppercase;color:var(--gray);font-weight:400}
.micro.ink{color:var(--ink)}
.micro.rule::after{content:"";display:inline-block;width:28px;height:1px;background:var(--line-2);margin-left:12px;vertical-align:middle}
.display{font-weight:300;font-size:clamp(44px,8.9vw,142px);line-height:.9;letter-spacing:-.03em;text-transform:uppercase}
.title{font-weight:300;font-size:clamp(44px,7.2vw,112px);line-height:.92;letter-spacing:-.03em}
.h2{font-weight:300;font-size:clamp(30px,3.6vw,54px);line-height:1.02;letter-spacing:-.02em}
.h3{font-weight:400;font-size:clamp(19px,1.6vw,24px);line-height:1.2;letter-spacing:-.005em}
.lead{font-size:clamp(16px,1.35vw,19px);line-height:1.4;color:var(--ink-2);max-width:46ch}
.muted{color:var(--gray)} .dim{color:var(--dim)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv11" 1}
.hr{height:1px;background:var(--line);border:0;margin:0}
.sec{margin-top:clamp(64px,9vw,140px)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 32px;flex-wrap:wrap;margin-bottom:28px}
.stack{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:16px}

/* pills: the only rounded controls */
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:var(--r-pill);padding:10px 22px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;transition:border-color .4s ease,background-color .4s ease,color .4s ease,letter-spacing var(--mid) var(--ease)}
.pill:hover{border-color:var(--ink)}
.pill.solid{background:var(--ink);color:#000;border-color:var(--ink)}
.pill.solid:hover{letter-spacing:.16em}
.pill.fill{background:var(--fill);border-color:var(--ink)}
.pill.sm{padding:7px 15px;font-size:11px}
.pill[aria-pressed="true"],.pill[aria-current="true"],.pill[aria-selected="true"]{background:var(--ink);color:#000;border-color:var(--ink)}
.pill:disabled{opacity:.35;cursor:not-allowed}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.link{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);border-bottom:1px solid var(--line-2);padding-bottom:3px;transition:color .4s ease,border-color .4s ease}
.link:hover{color:var(--ink);border-color:var(--ink)}
.textbtn{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);transition:color .4s ease}
.textbtn:hover,.textbtn[aria-pressed="true"],.textbtn[aria-current="true"],.textbtn[aria-selected="true"]{color:var(--ink)}
.textbtn[aria-pressed="true"],.textbtn[aria-current="true"],.textbtn[aria-selected="true"]{box-shadow:0 1px 0 var(--ink);padding-bottom:5px}

/* fields: underline only, square */
.field{background:transparent;border:0;border-bottom:1px solid var(--line-2);border-radius:0;padding:10px 0;min-width:0;width:100%;font-size:16px;transition:border-color .4s ease}
.field:focus{outline:none;border-color:var(--ink)}
.field::placeholder{color:var(--dim)}
select.field{appearance:none;-webkit-appearance:none;padding-right:22px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px;background-repeat:no-repeat}
select.field option{background:#111;color:#fff}
label.lab{display:flex;flex-direction:column;gap:2px;min-width:0}
input[type=range]{accent-color:#fff;width:100%}

/* stats set in type, never in cards */
.stat{display:flex;flex-direction:column;gap:10px;min-width:0}
.stat-v{font-weight:300;font-size:clamp(34px,4vw,60px);line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat-v small{font-size:.42em;color:var(--gray);letter-spacing:0;margin-left:.2em}
.stat.sm .stat-v{font-size:clamp(26px,2.6vw,38px)}
.stats{display:flex;flex-wrap:wrap;gap:28px clamp(32px,6vw,96px)}
.stars{color:var(--gold);letter-spacing:.12em;font-size:15px;white-space:nowrap}
.stars i{font-style:normal;color:#3a3a3a}
.note{font-size:13px;line-height:1.5;color:var(--gray);max-width:62ch}
.banner{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;display:flex;gap:10px 24px;flex-wrap:wrap;align-items:baseline}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,24px);background:#fff;color:#000;padding:12px 22px;border-radius:var(--r-pill);font-size:13px;letter-spacing:.06em;opacity:0;pointer-events:none;transition:transform var(--mid) var(--ease),opacity .4s ease;z-index:90;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* editorial data table */
.table-wrap{overflow-x:auto;scrollbar-width:thin;scrollbar-color:#333 transparent}
table.data{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.data th{font:400 11px/1.3 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--gray);text-align:right;padding:0 0 14px 20px;white-space:nowrap;border-bottom:1px solid var(--line-2)}
table.data td{padding:15px 0 15px 20px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.data th:first-child,table.data td:first-child{padding-left:0}
table.data .l{text-align:left}
table.data th button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;transition:color .4s ease}
table.data th button:hover,table.data th[aria-sort] button{color:var(--ink)}
table.data tbody tr{transition:background-color .4s ease}
table.data tbody tr.go{cursor:pointer}
table.data tbody tr.go:hover{background:rgba(255,255,255,.035)}
.heroCell{display:flex;align-items:center;gap:14px;min-width:0}
.heroCell img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;filter:saturate(.9)}
.heroCell b{font-weight:400;font-size:17px}
.move{font-size:11px;letter-spacing:.06em;color:var(--gray);margin-left:10px}
.win{font-weight:600;color:var(--ink)} .lose{color:var(--gray)}

/* =============================== NAVIGATION =============================== */
.nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:60;display:flex;align-items:center;justify-content:space-between;gap:20px;padding-inline:var(--pad);transition:background-color var(--mid) var(--ease)}
.nav.solid{background:rgba(11,11,12,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-size:17px;letter-spacing:.2em;font-weight:400;white-space:nowrap}
.nav-links{display:flex;gap:clamp(16px,2.2vw,34px);align-items:center}
.nav-links a{font-size:12px;letter-spacing:.06em;color:var(--ink-2);opacity:.78;transition:opacity .4s ease}
.nav-links a:hover,.nav-links a[aria-current="page"]{opacity:1}
.nav-links a[aria-current="page"]{box-shadow:0 1px 0 var(--ink);padding-bottom:4px}
.nav-right{display:flex;align-items:center;gap:14px}
.iconbtn{width:38px;height:38px;border:1px solid var(--line-2);border-radius:50%;display:grid;place-items:center;transition:border-color .4s ease}
.iconbtn:hover{border-color:var(--ink)}
.iconbtn svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.5}
.menu-btn{display:none}
.pp{position:relative}
.picker{position:absolute;right:0;top:calc(100% + 10px);width:min(340px,calc(100vw - 40px));max-height:min(62vh,480px);overflow:auto;background:#101011;border:1px solid var(--line-2);z-index:70;scrollbar-width:thin;scrollbar-color:#333 transparent;animation:enter .5s var(--ease) both}
.picker button{display:grid;grid-template-columns:8px 64px minmax(0,1fr) auto;gap:10px;align-items:baseline;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;transition:background-color .4s ease}
.picker button:hover{background:rgba(255,255,255,.05)}
.picker button[aria-selected="true"]{background:#fff;color:#000}
.picker button i{width:5px;height:5px;border-radius:50%;align-self:center}
.picker button i.has{background:currentColor}
.picker .pn,.picker .pd{font-size:12px;opacity:.6}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(6,6,7,.94);display:flex;flex-direction:column;padding:calc(var(--nav-h) + 20px) var(--pad) 40px;animation:fade .5s ease both;overflow:auto}
@keyframes fade{from{opacity:0}}
.overlay .close{position:absolute;top:14px;right:var(--pad)}
.cmd input{font-weight:300;font-size:clamp(30px,6vw,84px);letter-spacing:-.03em;border-bottom:1px solid var(--line-2);padding:8px 0 14px}
.cmd-list{margin-top:18px;max-width:900px}
.cmd-list a{display:flex;align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid var(--line);transition:padding-left var(--mid) var(--ease),color .4s ease;color:var(--gray)}
.cmd-list a:hover,.cmd-list a.act{padding-left:14px;color:var(--ink)}
.cmd-list img{width:38px;height:38px;border-radius:50%}
.cmd-list b{font-weight:300;font-size:26px;letter-spacing:-.01em}
.mmenu a{display:block;font-weight:300;font-size:clamp(38px,11vw,72px);letter-spacing:-.03em;line-height:1.08;padding:4px 0}
.foot{border-top:1px solid var(--line);margin-top:0;padding:34px 0 60px;display:flex;justify-content:space-between;gap:20px 40px;flex-wrap:wrap}
.foot p{font-size:11px;line-height:1.5;color:var(--dim);max-width:60ch}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gray);margin-right:8px;vertical-align:middle}
.status-dot.live{background:#fff} .status-dot.off{background:transparent;box-shadow:inset 0 0 0 1px var(--gray)}

/* ============================ MEDIA (iridescent) ========================== */
.media{position:relative;border-radius:var(--r-media);overflow:hidden;isolation:isolate}

.media .art{position:absolute;z-index:-2;right:0;bottom:0;height:100%;width:min(46%,680px);object-fit:cover;object-position:50% 14%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 58%,#000 100%),linear-gradient(0deg,transparent 4%,#000 44%,#000 86%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 58%,#000 100%),linear-gradient(0deg,transparent 4%,#000 44%,#000 86%,transparent 100%);mask-composite:intersect;
  filter:contrast(1.05) saturate(.92);transition:opacity var(--slow) var(--ease),transform 1.6s var(--ease)}
.media .art.swap{opacity:0;transform:scale(1.03)}
.media .veil{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(5,5,5,.5) 0,rgba(5,5,5,.12) 42%,rgba(5,5,5,0) 62%),linear-gradient(0deg,rgba(5,5,5,.88) 0,rgba(5,5,5,0) 34%);pointer-events:none}

/* ================================== HOME ================================== */

.hd-media .veil{background:linear-gradient(90deg,rgba(5,5,5,.5) 0,rgba(5,5,5,.12) 42%,rgba(5,5,5,0) 62%),linear-gradient(0deg,rgba(5,5,5,.55) 0,rgba(5,5,5,0) 40%)}

.outer{padding-inline:clamp(10px,1.6vw,26px)}














.toplist li a{display:grid;grid-template-columns:28px 34px minmax(0,1fr) 28px 52px;gap:12px;align-items:center;padding:11px 8px 11px 0;border-bottom:1px solid var(--line);transition:background-color .4s ease,padding-left var(--mid) var(--ease)}
.toplist li a:hover{background:rgba(255,255,255,.04);padding-left:8px}
.toplist li a.cur{background:rgba(255,255,255,.05);color:var(--gold)}
.toplist img{width:30px;height:30px;border-radius:50%}
.toplist .idx{font-size:10px;letter-spacing:.14em;color:var(--gray)}
.spark{width:100%;max-width:260px;height:56px;display:block}
.spark path.l{fill:none;stroke:var(--gold);stroke-width:1.2}
.spark path.a{fill:url(#sparkfill);stroke:none}

/* ================================= HEROES ================================= */
.filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,300px) minmax(150px,220px);gap:20px 40px;align-items:end;margin-top:clamp(36px,5vw,72px)}








.ri{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.3;flex:none;vertical-align:-2px}


.lang{display:flex;gap:6px}
.lang button{width:26px;height:18px;padding:0;border:1px solid var(--line-2);opacity:.45;transition:opacity .4s ease,border-color .4s ease;display:block;overflow:hidden}
.lang button svg{display:block;width:100%;height:100%}
.lang button[aria-pressed="true"],.lang button:hover{opacity:1;border-color:#fff}







/* =============================== HERO DETAIL ============================== */
.hd-media{min-height:min(78vh,780px);display:flex;flex-direction:column;justify-content:flex-end;padding:calc(var(--nav-h) + 20px) clamp(22px,4.4vw,64px) clamp(26px,3.4vw,46px)}
.hd-media .art{width:min(52%,720px)}
.hd-name{font-weight:300;font-size:clamp(56px,11.5vw,190px);line-height:.84;letter-spacing:-.045em;margin:18px 0 26px;overflow-wrap:anywhere}
.hd-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-2);margin-top:8px}
.hd-stats .stat{padding:26px clamp(14px,2.4vw,40px) 6px}
.hd-stats .stat:first-child{padding-left:0}
.hd-stats .stat+.stat{border-left:1px solid var(--line)}
.tabs{display:flex;gap:clamp(18px,3vw,44px);border-bottom:1px solid var(--line);padding:26px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .textbtn{white-space:nowrap;flex:none}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,110px);align-items:start}
.catlist li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.catlist li:last-child{border-bottom:0}
.catlist .v{font-weight:300;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.radar{width:100%;max-width:520px;height:auto;display:block;margin-inline:auto}
.radar .grid{fill:none;stroke:rgba(255,255,255,.12);stroke-width:1}
.radar .axis{stroke:rgba(255,255,255,.1);stroke-width:1}
.radar .shape{fill:rgba(255,255,255,.1);stroke:#fff;stroke-width:1.2}
.radar .shape.b{fill:rgba(216,195,122,.1);stroke:var(--gold)}
.radar text{fill:var(--gray);font:400 10px var(--font);letter-spacing:.14em;text-transform:uppercase}
.radar .dot{fill:#fff}
.radar .dot.b{fill:var(--gold)}
.chart{width:100%;height:auto;display:block}
.chart .l{fill:none;stroke:#fff;stroke-width:1.2}
.chart .l2{fill:none;stroke:var(--gray);stroke-width:1;stroke-dasharray:3 4}
.chart .g{stroke:rgba(255,255,255,.1);stroke-width:1}
.chart text{fill:var(--gray);font:400 10px var(--font);letter-spacing:.08em}
.empty{padding:44px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px;align-items:flex-start}

/* ================================ RANKINGS ================================ */
.rk-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 40px;flex-wrap:wrap;margin-top:clamp(36px,5vw,72px)}










.matrix{width:100%;height:auto;display:block;overflow:visible}
.matrix .g{stroke:rgba(255,255,255,.09)}
.matrix .ax{stroke:rgba(255,255,255,.3)}
.matrix text{fill:var(--gray);font:400 10px var(--font);letter-spacing:.12em;text-transform:uppercase}
.matrix a circle{stroke:rgba(255,255,255,.5);stroke-width:1;fill:#111;transition:stroke .4s ease}
.matrix a:hover circle,.matrix a:focus circle{stroke:#fff;stroke-width:2}
.tip{position:fixed;z-index:50;background:#fff;color:#000;padding:12px 16px;font-size:12px;line-height:1.5;pointer-events:none;min-width:170px;opacity:0;transition:opacity .3s ease}
.tip.on{opacity:1}
.tip b{display:block;font-weight:500;font-size:15px;margin-bottom:4px}

/* ================================= COMPARE ================================ */
.cmp-media{min-height:min(64vh,620px);padding:calc(var(--nav-h) + 20px) clamp(22px,4.4vw,64px) clamp(26px,3.4vw,46px);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:20px;align-items:end}
.cmp-media .art{width:36%}
.cmp-media .art.left{right:auto;left:0;-webkit-mask-image:linear-gradient(270deg,transparent 0,#000 46%),linear-gradient(0deg,transparent 0,#000 34%);mask-image:linear-gradient(270deg,transparent 0,#000 46%),linear-gradient(0deg,transparent 0,#000 34%)}
.cmp-media .veil{background:linear-gradient(0deg,rgba(5,5,5,.9) 0,rgba(5,5,5,.1) 60%),radial-gradient(50% 80% at 50% 50%,rgba(5,5,5,.75),transparent)}
.cmp-name{font-weight:300;font-size:clamp(34px,6vw,96px);line-height:.88;letter-spacing:-.04em;overflow-wrap:anywhere}
.cmp-side.r{text-align:right;align-items:flex-end}
.cmp-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.cmp-side select.field{max-width:260px}
.vs{font-weight:300;font-size:clamp(18px,2vw,28px);letter-spacing:.2em;color:var(--gray);padding-bottom:10px}
table.cmp td:nth-child(2),table.cmp th:nth-child(2){text-align:center;color:var(--gray)}
table.cmp td:first-child,table.cmp th:first-child{text-align:left}
table.cmp td{font-size:22px;font-weight:300}
table.cmp td:nth-child(2){font-size:11px;letter-spacing:.16em;text-transform:uppercase}

/* ================================ COMMUNITY =============================== */
.dist{display:grid;grid-template-columns:34px minmax(0,1fr) 46px;gap:14px;align-items:center;padding:7px 0;font-size:13px;font-variant-numeric:tabular-nums}
.dist .bar{height:1px;background:var(--line);position:relative}
.dist .bar i{position:absolute;left:0;top:-1px;height:3px;background:#fff;transition:width var(--slow) var(--ease)}
.rate{display:flex;gap:6px}
.rate button{width:46px;height:46px;border:1px solid var(--line-2);border-radius:50%;font-size:18px;color:var(--gray);transition:background-color .4s ease,color .4s ease,border-color .4s ease}
.rate button:hover,.rate button.on{background:#fff;color:#000;border-color:#fff}

/* =============================== METHODOLOGY ============================== */
.flow{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.flow li{font-weight:300;font-size:clamp(26px,3.4vw,50px);letter-spacing:-.025em;line-height:1.1;padding:10px 0}
.flow li+li::before{content:"↓";display:block;font-size:16px;color:var(--gray);padding:2px 0 10px 4px}
.formula{font:400 clamp(14px,1.3vw,17px)/1.7 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--ink-2);white-space:pre-wrap;border-left:1px solid var(--line-2);padding-left:22px}
.defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(32px,6vw,110px)}
.defs article{padding:26px 0;border-top:1px solid var(--line)}
.defs article p{margin-top:10px}
.faq details{border-top:1px solid var(--line);padding:20px 0}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;font-size:20px;font-weight:300;list-style:none;display:flex;justify-content:space-between;gap:20px}
.faq summary::after{content:"+";color:var(--gray)}
.faq details[open] summary::after{content:"–"}
.faq p{margin-top:14px}

/* ================================== AUTH ================================== */
.auth-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,110px);margin-top:clamp(36px,5vw,72px)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 20px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv dt{color:var(--gray);font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding-top:4px}
.kv dd{margin:0;overflow-wrap:anywhere}
dl{margin:0}

/* ================================== ADMIN ================================= */
.admin{display:grid;grid-template-columns:190px minmax(0,1fr);gap:clamp(28px,5vw,84px);margin-top:clamp(30px,4vw,56px)}
.admin-nav{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(var(--nav-h) + 20px);align-self:start}
.admin-nav a{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);transition:color .4s ease}
.admin-nav a:hover,.admin-nav a[aria-current="page"]{color:var(--ink)}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 32px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:20px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.wrow input{text-align:right;font-size:22px;font-weight:300;padding:4px 0}
.wrow.total{border-bottom:0;border-top:1px solid var(--line-2);padding-top:18px;font-size:22px;font-weight:300}
.err{color:#fff;border:1px solid #fff;padding:10px 16px;font-size:13px;display:inline-block}
.evgrid{display:grid;grid-template-columns:minmax(200px,280px) minmax(0,1fr);gap:clamp(24px,4vw,64px)}
.evlist{max-height:70vh;overflow:auto;border-top:1px solid var(--line-2);scrollbar-width:thin;scrollbar-color:#333 transparent}
.evlist button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 8px 11px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--gray);transition:color .4s ease,padding-left var(--mid) var(--ease)}
.evlist button:hover{color:var(--ink)}
.evlist button[aria-current="true"]{color:var(--ink);padding-left:10px;box-shadow:inset 1px 0 0 #fff}
.evlist small{font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.catedit{padding:18px 0;border-bottom:1px solid var(--line)}
.catedit .top{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:20px;align-items:baseline}
.catedit input[type=number]{text-align:right;font-size:26px;font-weight:300;padding:2px 0}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:center;padding:8px 0;font-size:14px;color:var(--ink-2)}
.q05{display:flex;gap:4px}
.q05 button{width:30px;height:30px;border:1px solid var(--line-2);border-radius:50%;font-size:12px;color:var(--gray);transition:background-color .4s ease,color .4s ease}
.q05 button.on,.q05 button:hover{background:#fff;color:#000;border-color:#fff}
.tag{display:inline-block;border:1px solid var(--line-2);border-radius:var(--r-pill);padding:3px 10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray)}
.tag.on{border-color:#fff;color:#fff}
dialog{background:#0e0e0f;color:var(--ink);border:1px solid var(--line-2);border-radius:0;padding:28px;width:min(860px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto}
dialog::backdrop{background:rgba(4,4,5,.86)}
dialog img{display:block;width:100%;height:auto;border:1px solid var(--line)}
dialog textarea{width:100%;min-height:120px;background:#070707;border:1px solid var(--line-2);border-radius:0;padding:12px;font:12px/1.5 ui-monospace,Consolas,monospace;resize:vertical}

/* hero directory: two columns across the full width */
.wrap.wide{max-width:none}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(28px,4vw,72px);margin-top:34px;border-top:1px solid var(--line-2)}
.hcard{display:grid;grid-template-columns:clamp(96px,10vw,150px) minmax(0,1fr) auto;gap:clamp(14px,2vw,28px);align-items:center;padding:16px 0;border-bottom:1px solid var(--line);transition:background-color .5s ease,padding var(--mid) var(--ease)}
.hcard:hover,.hcard:focus-visible{background:rgba(255,255,255,.045);padding-inline:14px}
.himg{display:block;aspect-ratio:16/10;overflow:hidden;background:#111}
.himg img{width:100%;height:100%;object-fit:cover;object-position:50% 14%;filter:saturate(.88);transition:transform var(--slow) var(--ease),filter .6s ease}
.hcard:hover .himg img{transform:scale(1.05);filter:none}
.hmain{display:flex;flex-direction:column;gap:10px;min-width:0}
.hmain b{font-weight:300;font-size:clamp(24px,2.5vw,40px);letter-spacing:-.025em;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hnum{display:flex;flex-direction:column;align-items:flex-end;gap:7px;text-align:right}
.hscore{font-weight:300;font-size:clamp(24px,2.3vw,36px);letter-spacing:-.03em;line-height:1}
.hscore small{font-size:13px;color:var(--gray);margin-left:10px;letter-spacing:.1em}

/* methodology: compact */
.msteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:clamp(34px,4vw,56px);border-top:1px solid var(--line-2);border-bottom:1px solid var(--line)}
.msteps li{padding:24px clamp(14px,2vw,30px) 26px;display:flex;flex-direction:column;gap:10px}
.msteps li:first-child{padding-left:0}
.msteps li+li{border-left:1px solid var(--line)}
.msteps b{font-weight:300;font-size:clamp(22px,2.2vw,32px);letter-spacing:-.02em;line-height:1.05}
.msec{display:grid;grid-template-columns:minmax(180px,.34fr) minmax(0,1fr);gap:20px clamp(28px,5vw,90px);padding:clamp(34px,4vw,56px) 0;border-bottom:1px solid var(--line)}
.mhead{display:flex;flex-direction:column;gap:12px}
.mex{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.7fr);gap:clamp(24px,4vw,64px);align-items:start}
.mres{display:flex;flex-direction:column;gap:24px}
.mtiers{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line-2)}
.mtiers li{padding:18px 12px 4px 0;display:flex;flex-direction:column;gap:8px}
.mtiers b{font-weight:300;font-size:clamp(28px,3.2vw,46px);letter-spacing:-.03em;line-height:1}
.mcats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 clamp(24px,4vw,64px);margin:0}
.mcats>div{padding:13px 0;border-top:1px solid var(--line)}
.mcats dt{font-size:16px}
.mcats dd{margin:4px 0 0}
.mkinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,4vw,64px)}
.mkinds p:last-child{margin-top:10px;font-size:17px;line-height:1.4;max-width:38ch}
.mrules li{padding:12px 0 12px 26px;border-top:1px solid var(--line);position:relative;font-size:16px}
.mrules li::before{content:"—";position:absolute;left:0;color:var(--gray)}
.msec .faq summary{font-size:17px}
.msec .faq details{padding:15px 0}
/* ================================ ANALYTICS ===============================
   Denser views (rankings, hero analysis, admin workspace). Same rules as everywhere:
   flat, monochrome, hairlines, no shadows. Colour only arrives with hero artwork. */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.show-m,.show-mr{display:none}
.mbar{display:block;height:1px;background:var(--line);position:relative;min-width:40px}
.mbar i{position:absolute;left:0;top:-1px;height:3px;background:#fff;transition:width var(--slow) var(--ease)}
details.more summary{cursor:pointer;list-style:none;display:inline-block}
details.more summary::-webkit-details-marker{display:none}
details.more{margin-top:30px}
/* hero list: the role a row's numbers belong to */



/* rankings */


.xbtn{width:30px;height:30px;border:1px solid var(--line-2);border-radius:50%;color:var(--gray);font-size:16px;line-height:1}
.xrow td{padding:0 0 18px!important;border-bottom:1px solid var(--line);white-space:normal!important}
.xrow dl{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin:0;text-align:left}
.xrow dd{margin:4px 0 0;font-size:15px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:36px 22px}
.gtile{display:flex;flex-direction:column;gap:8px;min-width:0}
.gimg{display:block;aspect-ratio:4/5;overflow:hidden;background:#111;margin-bottom:6px}
.gimg img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;filter:saturate(.85);transition:transform var(--slow) var(--ease),filter .6s ease}
.gtile:hover .gimg img,.gtile:focus-visible .gimg img{transform:scale(1.05);filter:none}
.gtile b{font-weight:300;font-size:22px;letter-spacing:-.02em;line-height:1.1}
.gscore{font-weight:300;font-size:30px;letter-spacing:-.03em;line-height:1}
.gscore small{font-size:13px;color:var(--gray);margin-left:10px;letter-spacing:.1em}
.gtop{display:flex;flex-wrap:wrap;gap:4px 14px}
/* meta overview: tier canvas */
.canvas{margin-top:22px;border-top:1px solid var(--line-2)}
.cband{display:grid;grid-template-columns:clamp(84px,11vw,170px) minmax(0,1fr);gap:20px;padding:30px 0;border-bottom:1px solid var(--line)}
.cband.none{padding:16px 0}
.ct{display:flex;flex-direction:column;gap:10px}
.ct .t{font-weight:300;font-size:clamp(48px,6.4vw,104px);line-height:.82;letter-spacing:-.04em}
.cband.none .t{font-size:clamp(24px,2.6vw,36px);color:var(--dim)}
.ctiles{display:flex;flex-wrap:wrap;gap:26px 18px;align-items:flex-start}
.ptile{display:flex;flex-direction:column;gap:5px;width:118px}
.pimg{display:block;position:relative;aspect-ratio:4/5;overflow:hidden;background:#111;margin-bottom:6px}
.pimg img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;filter:saturate(.85);transition:transform var(--slow) var(--ease),filter .6s ease}
.ptile:hover .pimg img,.ptile:focus-visible .pimg img{transform:scale(1.06);filter:none}
.prank{position:absolute;left:0;bottom:0;background:#0b0b0c;color:#fff;font-size:11px;letter-spacing:.08em;padding:5px 8px 4px}
.ptile b{font-weight:400;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pscore{font-weight:300;font-size:22px;letter-spacing:-.02em}
.matrix text.big{font-size:26px;font-weight:300;letter-spacing:-.02em;fill:#fff;text-transform:none}
/* hero analysis */
.why li{display:grid;grid-template-columns:92px 96px minmax(0,1fr) 78px;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.why li>.num:last-child{text-align:right;font-size:17px}
.why li.total{border-bottom:0;border-top:1px solid var(--line-2)}
.why li.total .num{font-weight:300;font-size:30px;letter-spacing:-.02em}
.profile li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.profile li>span{font-weight:300;font-size:clamp(22px,2.4vw,34px);letter-spacing:-.02em;line-height:1.1}
.insights li{padding:16px 0;border-bottom:1px solid var(--line)}
.insights li p:last-child{margin-top:8px;font-size:17px}
.wchips{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:26px 28px}
.wchips li{display:flex;flex-direction:column;gap:8px}
.wchips .num{font-weight:300;font-size:clamp(26px,2.6vw,38px);letter-spacing:-.03em;line-height:1}
.toplist li a[aria-current="true"]{background:rgba(255,255,255,.07)}
.toplist li a.cur{color:var(--ink);box-shadow:inset 1px 0 0 #fff;padding-left:10px}
/* methodology: three kinds of data */
.kinds .kind{font-weight:300;font-size:clamp(20px,2vw,28px);letter-spacing:-.02em;line-height:1.2;margin-top:14px}
.kinds .arrow{color:var(--gray);margin:12px 0 0 2px}
/* account */
.perm li,.evcheck li{position:relative}
.perm li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:13px 0;border-bottom:1px solid var(--line);color:var(--gray)}
.perm li.ok{color:var(--ink)}
/* admin evaluation workspace */
.evgrid{grid-template-columns:minmax(190px,250px) minmax(0,1fr) minmax(360px,.62fr);grid-template-areas:"list head rail" "list ed rail";gap:26px clamp(24px,3vw,52px);align-items:start}
.evgrid>.evlist{grid-area:list}.evhead{grid-area:head;min-width:0}.evrail{grid-area:rail;position:sticky;top:calc(var(--nav-h) + 20px);display:flex;flex-direction:column;gap:30px}.eved{grid-area:ed;min-width:0}.evside{display:flex;flex-direction:column;gap:22px}
.evhero{display:flex;gap:22px;align-items:flex-end}
.evhero img{width:104px;height:130px;object-fit:cover;object-position:50% 12%;flex:none}
.evcount{display:flex;align-items:baseline;gap:14px;margin:14px 0 10px}
.evcount .num{font-weight:300;font-size:40px;letter-spacing:-.03em;line-height:1}
.evcheck li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--gray)}
.evcheck li.ok{color:var(--ink)}
.evnums{display:grid;grid-template-columns:1fr 1fr;gap:20px 16px}
.evnums .stat:last-child{grid-column:1/-1}
.evside .radar{max-width:none}
.radar.big text{font-size:24px;letter-spacing:.06em;fill:var(--ink-2)}
.radar.big text.val{font-size:34px;font-weight:300;letter-spacing:-.01em;fill:#fff}
.radar.big .dot{r:4px}
.radar.big .shape{stroke-width:2}
.catedit.open .top .micro.ink{color:var(--gray)}
input[type=range].unset{opacity:.28}
.eved .banner .pill{white-space:normal;text-align:left;max-width:100%;height:auto;line-height:1.3;padding-block:9px}
.sugg{margin-top:12px;padding:12px 0 2px 14px;border-left:1px solid var(--line-2)}
.sugg .note{margin-top:6px;max-width:none;color:var(--ink-2)}
.q05 button.sug:not(.on){border-style:dashed;border-color:#fff;color:#fff}
.wrow .mbar{grid-column:1/-1}

/* ============================== REDESIGN 10/12 =============================
   Wordmark, footer, start page, role picker, cut-out hero figures, panels that
   melt into the page instead of sitting in boxes. */
.bm{display:inline-flex;align-items:center;gap:9px;font-size:15px;letter-spacing:.24em}
.bm b{font-weight:600}.bm span{font-weight:300;color:var(--ink-2);margin-left:-.12em}
.bm-ring{width:20px;height:20px;flex:none;fill:none}
.bm-ring circle{stroke:rgba(255,255,255,.35);stroke-width:1.2}
.bm-ring path{stroke:#fff;stroke-width:1.8;stroke-linecap:round}
.brand{letter-spacing:0}
/* footer */
.foot{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.2fr);gap:28px clamp(28px,5vw,90px);align-items:start;padding:40px 0 56px}
.foot p{font-size:12px;color:var(--gray)}
.foot-claim{margin-top:14px;font-size:14px!important;color:var(--ink-2)!important}
.foot-src{display:grid;gap:10px;margin:0}
.foot-src>div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;font-size:12px}
.foot-src dt{color:var(--dim);letter-spacing:.14em;text-transform:uppercase;font-size:10px;padding-top:2px}
.foot-src dd{margin:0;color:var(--ink-2)}
.foot-links{display:flex;gap:18px;align-items:center;margin-top:14px;flex-wrap:wrap}
.foot-links a.textbtn{text-decoration:none}.foot-links .textbtn[aria-current="page"]{color:var(--ink);box-shadow:0 1px 0 var(--ink);padding-bottom:5px}
/* cut-out figures: no box, a soft fade at the feet, a faint violet rim like the sky behind */
img.cut.soft{filter:none;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 45%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 45%,#000 55%,transparent 100%)}
img.cut{object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 0 22px rgba(150,60,120,.28)) drop-shadow(0 10px 30px rgba(0,0,0,.55));-webkit-mask-image:linear-gradient(to top,transparent 0,#000 18%),linear-gradient(to bottom,transparent 0,#000 7%),linear-gradient(to right,transparent 0,#000 7%),linear-gradient(to left,transparent 0,#000 7%);mask-image:linear-gradient(to top,transparent 0,#000 18%),linear-gradient(to bottom,transparent 0,#000 7%),linear-gradient(to right,transparent 0,#000 7%),linear-gradient(to left,transparent 0,#000 7%);-webkit-mask-composite:source-in;mask-composite:intersect}
/* panels melt into the page */
.outer{padding-inline:0}
.media{border-radius:0;overflow:visible;overflow-x:clip}
.media .veil{-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent 100%);mask-image:linear-gradient(to bottom,#000 55%,transparent 100%)}
.media .art.cut{width:min(44%,640px);height:100%;object-fit:contain;object-position:100% 100%;-webkit-mask-image:linear-gradient(to top,transparent 0,#000 22%),linear-gradient(to bottom,transparent 0,#000 7%),linear-gradient(to right,transparent 0,#000 7%),linear-gradient(to left,transparent 0,#000 7%);mask-image:linear-gradient(to top,transparent 0,#000 22%),linear-gradient(to bottom,transparent 0,#000 7%),linear-gradient(to right,transparent 0,#000 7%),linear-gradient(to left,transparent 0,#000 7%);-webkit-mask-composite:source-in;mask-composite:intersect}
.cmp-media .art.cut{width:32%}
.cmp-media .art.left.cut{object-position:0 100%}
.hd-media{padding-inline:var(--pad)}
.cmp-media{padding-inline:var(--pad)}
/* start page */












.home-roles{margin-top:clamp(40px,6vw,90px)}
.rgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-top:1px solid var(--line-2)}
.rcol{padding:26px clamp(14px,1.8vw,30px) 10px;display:flex;flex-direction:column;gap:14px}
.rcol:first-child{padding-left:0}
.rcol+.rcol{border-left:1px solid var(--line)}
.rcol header{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.rcol header .ri{width:18px;height:18px}
.rcol ol{display:flex;flex-direction:column}
.rcol li a{display:grid;grid-template-columns:16px 62px minmax(0,1fr) auto;gap:12px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line);transition:padding-left var(--mid) var(--ease)}
.rcol li a:hover{padding-left:6px}
.rpos{font-size:11px;color:var(--gray);align-self:center}
.rimg{display:block;width:62px;height:68px;overflow:hidden}
.rimg img{width:100%;height:100%;object-position:50% 0;object-fit:cover}
.rname{display:flex;flex-direction:column;gap:5px;min-width:0;align-self:center}
.rname b{font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv{font-weight:300;font-size:24px;letter-spacing:-.02em;align-self:center}
.rnote{min-height:1em;margin-top:2px}
/* rankings: role as title, role panel, segmented view switch */
.rk-head{position:relative;margin-top:18px;display:inline-block}
.rk-title{display:inline-flex;align-items:baseline;gap:18px;text-align:left}
.rk-title .title{transition:opacity .4s ease}
.rk-title:hover .title{opacity:.85}
.rk-chev{font-size:clamp(28px,3vw,48px);color:var(--gray);transform:translateY(-.1em);transition:transform .6s var(--ease)}
.rk-title[aria-expanded="true"] .rk-chev{transform:translateY(-.1em) rotate(180deg)}
.rolepop{position:absolute;left:0;top:calc(100% + 12px);z-index:30;display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:fade .4s ease both}
.rp{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:20px 22px;background:rgba(11,11,12,.92);text-align:left;transition:background-color .4s ease}
.rp:hover{background:rgba(30,26,36,.95)}
.rp[aria-pressed="true"]{background:#fff;color:#000}
.rp[aria-pressed="true"] .micro{color:#555}
.rp .ri{width:22px;height:22px}

 and stunning. The disk can ricochet to multiple targets.":"Wirf eine elektromagnetische Scheibe, die Schaden verursacht und betäubt (Stun). Die Scheibe kann von mehreren Zielen abprallen.","Shoot the ground to form a pool of radiation that deals damage and slows,\n\nAfter a duration the radiation erupts, dealing damage and slowing.":"Schieße auf den Boden, um eine Strahlungspfütze zu erzeugen, die Schaden verursacht und verlangsamt (Slow).\n\nNach einer gewissen Dauer bricht die Strahlung aus, verursacht Schaden und verlangsamt (Slow).","Apply cellular restructuring to yourself or an ally, granting movement speed and Revival for a duration.\nIf the target takes lethal damage within this time, they will Resurrect.":"Wende zelluläre Umstrukturierung auf dich selbst oder einen Verbündeten an und gewähre für eine Dauer Bewegungstempo und Wiederbelebung.\nErleidet das Ziel in dieser Zeit tödlichen Schaden, wird es wiederbelebt.","Gain a stack when damaging enemy heroes.\n\nAt maximum stacks gain movement speed.":"Erhalte einen Stack, wenn du gegnerischen Helden Schaden zufügst.\n\nBei maximalen Stacks erhältst du Bewegungstempo.","Prizefighter":"Preisboxer","Crunch is a colossal melee fighter who chains devastating combos using his abilities to quickly turn his foes to scrap.":"Crunch ist ein kolossaler Nahkämpfer, der mit seinen Fähigkeiten verheerende Kombos aneinanderreiht und seine Gegner im Nu zu Schrott verarbeitet.","Beat down your enemies with your turbocharged fists.":"Prügle deine Feinde mit deinen turbogeladenen Fäusten nieder.","Dash forward, dealing damage. Colliding with an enemy hero stuns.\nEmpowered: Dash an extended distance, Pushing Enemy Heroes along.":"Stürme nach vorn und verursache Schaden. Die Kollision mit einem gegnerischen Helden betäubt (Stun).\nVerstärkt: Stürme eine größere Distanz nach vorn und schiebe gegnerische Helden dabei mit.","Crunch swings his fist, dealing damage to enemies in front of him.\nEmpowered: Crunch swings both fists, dealing true damage instead.":"Crunch schwingt seine Faust und verursacht Schaden bei Gegnern vor ihm.\nVerstärkt: Crunch schwingt beide Fäuste und verursacht stattdessen True Damage.","Crunch jabs, dealing damage and slowing everything hit.\nEmpowered: Deals damage and knocks them up instead.":"Crunch schlägt eine Gerade und verursacht Schaden und verlangsamt (Slow) alles, was getroffen wird.\nVerstärkt: Verursacht stattdessen Schaden und schleudert die Ziele in die Luft (Knock-up).","Passive: Every third basic attack or ability hit heals you.\n\nActive: Repeat the last ability used.":"Passiv: Jeder dritte Standardangriff oder Fähigkeitstreffer heilt dich.\n\nAktiv: Wiederhole die zuletzt eingesetzte Fähigkeit.","After casting an ability, amplifies your next basic attack to deal damage and reduce your cooldowns. Additionally, every third ability used will be Empowered.":"Nach dem Wirken einer Fähigkeit wird dein nächster Standardangriff verstärkt, verursacht Schaden und verringert deine Cooldowns. Außerdem wird jede dritte eingesetzte Fähigkeit verstärkt.","Vampiric Matriarch":"Vampirische Matriarchin","Embrace the darkness with Countess, a deadly assassin whose swift, shadowy assaults leave her foes drained and dispatched before they know what hit them.":"Tauche mit Countess in die Dunkelheit ein, einer tödlichen Assassine, deren schnelle, schattenhafte Angriffe ihre Feinde auslaugen und erledigen, bevor sie wissen, wie ihnen geschieht.","Cut through foes with your twin Chokutos Sophia and Marie.":"Zerschneide Feinde mit deinen Zwillings-Chokutos Sophia und Marie.","Spin and strike everything around you dealing damage and healing yourself for everything hit.":"Wirble herum und triff alles um dich herum, verursache Schaden und heile dich für alles, was getroffen wurde.","Rapidly dash to a location in a cloud of blood, dealing damage and slowing target's hit. Leaves behind a Shadow at your original position. Re-triggering the ability will return you to the Shadow's location.":"Sprinte in einer Blutwolke rasch zu einem Ort, verursache Schaden und verlangsame (Slow) getroffene Ziele. Hinterlässt einen Schatten an deiner ursprünglichen Position. Erneutes Auslösen der Fähigkeit bringt dich zur Position des Schattens zurück.","Send out a cloud of darkness dealing damage in its path.":"Sende eine Dunkelheitswolke aus, die auf ihrem Weg Schaden verursacht.","Leap to a nearby Enemy Hero, forcing them to face you, suppressing them and dealing damage. Heal for half of the damage dealt.":"Spring zu einem nahen gegnerischen Helden, zwinge ihn, dich anzusehen, unterdrücke ihn und verursache Schaden. Heile dich um die Hälfte des verursachten Schadens.","Repeat ability hits on enemy heroes applies haemorrhage, dealing damage and granting Countess  movement speed.":"Wiederholte Fähigkeitstreffer auf gegnerische Helden verursachen eine Blutung, die Schaden verursacht und Countess Bewegungstempo gewährt.","Ruinous Witch":"Verderbende Hexe","Renna is a herald of ruin whose vengeful spite corrupts the battlefield, channeling chaotic Riftmagic through her demonic cane. Command the abyss to shatter enemy formations, before erasing all rivals with absolute, scornful dominance.":"Renna ist eine Heroldin des Verderbens, deren rachsüchtige Bosheit das Schlachtfeld korrumpiert und die mit ihrem dämonischen Stock chaotische Riftmagie kanalisiert. Befiehl dem Abgrund, gegnerische Formationen zu zerschmettern, bevor du alle Rivalen mit absoluter, verächtlicher Dominanz auslöschst.","Fire bolts of chaotic energy at your foes.":"Feuere Blitze chaotischer Energie auf deine Feinde ab.","Spin your cane, unleashing multiple waves of chaotic energy that pierce through and damage all enemies in their path.":"Wirble deinen Stock und entfessele mehrere Wellen chaotischer Energie, die durchdringen und alle Gegner auf ihrem Weg beschädigen.","Launch a Soul Orb that pulls in and damages foes. Heal yourself when damaging enemies that are caught in its area.":"Schleudere eine Seelenkugel, die Feinde heranzieht und ihnen Schaden zufügt. Heile dich, wenn du Gegnern Schaden zufügst, die in ihrem Bereich gefangen sind.","Leap into the air and fire an Orb of Deception, mesmerizing and damaging any enemies caught in its explosion.":"Spring in die Luft und feuere eine Kugel der Täuschung ab, die alle Gegner in ihrer Explosion hypnotisiert (Mesmerize) und ihnen Schaden zufügt.","Teleport to a location and summon an infernal singularity above you that repeatedly attacks all nearby enemies.":"Teleportiere dich an einen Ort und beschwöre über dir eine höllische Singularität, die wiederholt alle Gegner in der Nähe angreift.","Renna can hover by jumping while airborne. Enemies also drop Essence when they die. Collect it to improve your abilities.":"Renna kann schweben, indem sie in der Luft springt. Außerdem lassen Gegner beim Tod Essenz fallen. Sammle sie, um deine Fähigkeiten zu verbessern.","C.E.O.":"C.E.O.","Fire explosive shells at your enemies that deal splash damage.":"Feuere explosive Granaten auf deine Feinde ab, die Flächenschaden verursachen.","Launch a cluster of proximity mines that explode when an enemy touches them, dealing damage and slowing.":"Schieße ein Bündel Annäherungsminen ab, die explodieren, wenn ein Gegner sie berührt, und Schaden verursachen sowie verlangsamen (Slow).","Fire a long range rocket that explodes on impact, dealing damage. The rocket can be charged up over a short duration to deal more damage.":"Feuere eine Langstreckenrakete ab, die beim Aufprall explodiert und Schaden verursacht. Die Rakete kann über kurze Zeit aufgeladen werden, um mehr Schaden zu verursachen.","Lob a mine that can be retriggered to explode dealing damage and knocking back enemies.":"Wirf eine Mine, die erneut ausgelöst werden kann, um zu explodieren, Schaden zu verursachen und Gegner zurückzuschleudern.","Thrust up into the sky and rain down a barrage of rockets in the direction you're looking dealing massive damage.":"Schieße in den Himmel und lasse in Blickrichtung ein Raketenfeuer niederregnen, das massiven Schaden verursacht.","Periodically your basic attack deals bonus AoE damage around the Target.":"Dein Standardangriff verursacht in regelmäßigen Abständen zusätzlichen Flächenschaden um das Ziel herum.","Wastelander":"Ödländer","Rule the wasteland with Drongo, the mad tinkerer whose arsenal of explosive boomerangs and chemical warfare can control the battlefield and dismantle foes.":"Beherrsche das Ödland mit Drongo, dem wahnsinnigen Tüftler, dessen Arsenal aus explosiven Bumerangs und chemischer Kriegsführung das Schlachtfeld kontrollieren und Gegner zerlegen kann.","Tear through your enemies with your .45, Lucy.":"Reiß deine Feinde mit deiner .45er, Lucy, in Stücke.","Throw a boomerang, dealing damage and slowing enemies. Repeat the effect when returning.":"Wirf einen Bumerang, der Schaden verursacht und Gegner verlangsamt (Slow). Der Effekt wiederholt sich beim Zurückkehren.","Toss a tear gas grenade that explodes dealing damage over time and silencing enemies.":"Wirf eine Tränengasgranate, die explodiert, über Zeit Schaden verursacht und Gegner zum Schweigen bringt (Silence).","Load Lucy with radioactive rounds that cause a buildup in enemies, erupting to deal damage after a short duration. Damaging irradiated targets with Old Rusty or Shrapnel Cannon causes them to erupt immediately.":"Lade Lucy mit radioaktiver Munition, die sich in Gegnern anreichert und nach kurzer Zeit ausbricht, um Schaden zu verursachen. Wenn du verstrahlte Ziele mit Old Rusty oder Shrapnel Cannon beschädigst, brechen sie sofort aus.","Unleash a blast of shrapnel, dealing damage and reducing enemy physical armor. This attack when used In-Air sends you flying backwards.":"Entfessele eine Schrapnellsalve, die Schaden verursacht und die physische Rüstung der Gegner verringert. Wird dieser Angriff in der Luft eingesetzt, schleudert er dich rückwärts davon.","Critical strikes and ability hits apply a bleed to enemies.":"Kritische Treffer und Fähigkeitstreffer verursachen bei Gegnern eine Blutung.","Pyromaniac":"Pyromanen","Set the battlefield ablaze with Iggy & Scorch, a Hero pair who excel at area control and causing chaos!":"Setze das Schlachtfeld in Brand mit Iggy & Scorch, einem Heldenduo, das sich auf Flächenkontrolle und das Stiften von Chaos versteht!","Coat your enemies in oil with Scorchs flammable spit.":"Überzieh deine Feinde mit Öl durch Scorchs brennbare Spucke.","Iggy flings a Molotov that deals damage to enemies hit by the explosion. A Fire Field will remain where the explosion occurs, dealing damage over time.":"Iggy schleudert einen Molotow, der Gegnern in der Explosion Schaden zufügt. Am Ort der Explosion bleibt ein Feuerfeld zurück, das über Zeit Schaden verursacht.","Iggy throws down a turret that shoots damaging fireballs at enemies. Hitting an enemy with Spew redirects turrets to attack that target.":"Iggy stellt einen Geschützturm auf, der schädliche Feuerbälle auf Gegner schießt. Trifft Spew einen Gegner, richten sich die Türme auf dieses Ziel aus.","Scorch hurls a ball of oil that deals damage and slows enemies.":"Scorch schleudert einen Ölball, der Schaden verursacht und Gegner verlangsamt (Slow).","Scorch unleashes a cone of flame gaining movement speed and dealing damage. At the end of the duration Scorch will deal damage and knock back enemy targets within the cone.":"Scorch entfesselt einen Flammenkegel, erhält Bewegungstempo und verursacht Schaden. Am Ende der Dauer verursacht Scorch Schaden und schleudert Gegner im Kegel zurück.","Basic attacks coat enemies in oil and slow them. Oiled enemies will become ignited by Iggy's fire attacks causing enemies to burn for extra damage.":"Standardangriffe überziehen Gegner mit Öl und verlangsamen (Slow) sie. Geölte Gegner werden durch Iggys Feuerangriffe entzündet und brennen für zusätzlichen Schaden.","Champion of Nyr":"Champion von Nyr","Ascend the battlefield with Zarus, a savage warrior who dominates the battlefield with his shield and spear in his quest for godhood.":"Steige mit Zarus auf, einem wilden Krieger, der das Schlachtfeld mit Schild und Speer auf seiner Suche nach der Gottwerdung beherrscht.","Pierce through your enemies with the Nyrian Spear.":"Durchbohre deine Feinde mit dem Nyrischen Speer.","Channel to throw The Spear of Nyr, dealing damage. Tapping this ability instead instantly stabs with the spear and reduces its cooldown.":"Kanalisiere, um den Speer von Nyr zu werfen und Schaden zu verursachen. Wird die Fähigkeit nur angetippt, stößt sie stattdessen sofort mit dem Speer zu und verringert ihren Cooldown.","Unfold a shield reducing incoming damage for the duration. Upon recasting or after the duration, swing the shield dealing damage and stunning.":"Klappe einen Schild aus, der für die Dauer eingehenden Schaden verringert. Beim erneuten Wirken oder nach Ablauf der Dauer schwingst du den Schild, verursachst Schaden und betäubst (Stun).","Dash in your current movement direction, gaining movement speed and attack speed for a short duration.":"Sprinte (Dash) in deine aktuelle Bewegungsrichtung und erhalte kurzzeitig Bewegungstempo und Angriffsgeschwindigkeit.","Leap at an enemy hero, dealing damage and spawning a coliseum around them. Killing this enemy in the coliseum permanently grants power.":"Spring auf einen gegnerischen Helden, verursache Schaden und lass um ihn ein Kolosseum entstehen. Wenn du diesen Gegner im Kolosseum tötest, erhältst du dauerhaft Stärke.","Gain a stack of Gladiator when dealing damage. Stacks grant increased power. After exiting combat, stacks will restore health.":"Erhalte einen Stack Gladiator, wenn du Schaden verursachst. Stacks gewähren erhöhte Stärke. Nach dem Verlassen des Kampfes stellen Stacks Leben wieder her.","Koru Shinzo":"Koru Shinzo","Slice through foes, Body and Spirit.":"Durchtrenne Feinde, Körper und Geist.","Hurl three exploding Kunai that mark targets for Severance.":"Schleudere drei explodierende Kunai, die Ziele für Severance markieren.","Perform a spinning kick to unleash souls, damaging, marking nearby enemies and healing you if they are a hero or monster. Casting in-air will cause you to leap upwards.":"Führe einen Wirbeltritt aus, der Seelen freisetzt, nahe Gegner beschädigt und markiert und dich heilt, wenn sie ein Held oder Monster sind. Wirkst du ihn in der Luft, springst du nach oben.","Rush forwards cutting through enemies in your path. If marked, their spirit is seperated, sharing damage dealt to it back to its host.":"Stürme vorwärts und durchschneide Gegner auf deinem Weg. Markierte Gegner werden von ihrem Geist getrennt, und der ihm zugefügte Schaden wird an seinen Wirt zurückgegeben.","Unleash a storm of souls, damaging and slowing nearby enemies before pulling them towards you, tearing their spirits from their body. Then perform a final downwards slash to strike all nearby enemies.":"Entfessele einen Seelensturm, der nahe Gegner beschädigt und verlangsamt (Slow), bevor er sie zu dir zieht und ihre Geister aus ihren Körpern reißt. Führe dann einen letzten Abwärtshieb aus, der alle Gegner in der Nähe trifft.","After casting an ability, empower your blade for your next two attacks to launch soul wave projectiles that deal bonus damage and bounce between foes.":"Nach dem Wirken einer Fähigkeit wird deine Klinge für deine nächsten zwei Angriffe verstärkt und feuert Seelenwellen-Projektile ab, die Bonusschaden verursachen und zwischen Feinden abprallen.","Mistmeadow's Nightmare":"Albtraum von Mistmeadow","Bludgeon enemies with your wooden fist.":"Prügle Gegner mit deiner hölzernen Faust nieder.","Wind up powerful vines that launch forward, damaging and pulling the first unfortunate enemy target hit towards you.":"Spanne mächtige Ranken an und schleudere sie nach vorn. Sie verursachen Schaden und ziehen das erste unglückliche Ziel zu dir heran.","Vomit bugs that heal and protect Allied Heroes whilst damaging and shredding Enemies.":"Erbrich Käfer, die verbündete Helden heilen und beschützen, während sie Gegnern Schaden zufügen und sie zerfleischen.","Channel energy, slowing yourself but gaining damage reduction. After the duration or upon reactivation, damage and mesmerize nearby enemies.":"Kanalisiere Energie, verlangsame dich dabei selbst, erhalte aber Schadensreduzierung. Nach Ablauf der Dauer oder bei erneuter Aktivierung verursachst du Schaden und hypnotisierst (Mesmerize) nahe Gegner.","Channel and absorb all light from the galaxy, preventing Enemy Heroes from seeing beyond a small radius. You also apply Contagion to all Heroes and grant yourself movement speed for the duration.":"Kanalisiere und absorbiere das gesamte Licht der Galaxie, sodass gegnerische Helden nicht über einen kleinen Radius hinaussehen können. Außerdem wendest du Ansteckung auf alle Helden an und erhältst für die Dauer Bewegungstempo.","Swipe with a magical vine that damages enemies, absorbing their essence, healing Mourn.":"Schlage mit einer magischen Ranke zu, die Gegnern Schaden zufügt, ihre Essenz absorbiert und Mourn heilt.","Everblossom":"Immerblüte","Entangle foes with The Fey, a nature sprite whose thorny summons and ensnaring vines blossom into a deadly dance, entrapping and enervating her prey.":"Verstrick deine Feinde mit The Fey, einer Naturgeistin, deren dornige Beschwörungen und umschlingende Ranken zu einem tödlichen Tanz erblühen und ihre Beute fesseln und entkräften.","Fire ferocious flowers at your prey.":"Feuere wilde Blumen auf deine Beute ab.","Hurl a small plant that deals damage over time then explodes for even more damage.":"Schleudere eine kleine Pflanze, die über Zeit Schaden verursacht und dann für noch mehr Schaden explodiert.","Summon a patch of thorny brambles, dealing damage and slowing enemies whilst speeding up allies.":"Beschwöre ein Dornengestrüpp, das Gegnern Schaden zufügt und sie verlangsamt (Slow), während es Verbündete beschleunigt.","Throw an orb of nature energy, dealing heavy damage.":"Wirf eine Kugel aus Naturenergie, die hohen Schaden verursacht.","Plant a magical seedling, awakening a giant fly trap that attaches itself to all nearby enemy heroes. After a brief delay, it Pulls its victims inward, dealing damage and stunning.":"Pflanze einen magischen Setzling und erwecke eine riesige Venusfliegenfalle, die sich an alle nahen gegnerischen Helden heftet. Nach kurzer Verzögerung zieht sie ihre Opfer nach innen, verursacht Schaden und betäubt (Stun).","Each time you kill an enemy, spawn an Untamed Growth on their corpse.":"Jedes Mal, wenn du einen Gegner tötest, entsteht auf seiner Leiche ein Untamed Growth.","Shadow Huntress":"Schattenjägerin","Fire lethal bolts at your prey with your hand crossbow, Wrath.":"Feuere mit deiner Handarmbrust Wrath tödliche Bolzen auf deine Beute ab.","Equip Mercy to fire a powerful shot, dealing damage and applying Vengeance stacks. Mercy can critically strike, benefits from lifesteal, and applies on-hit effects.":"Rüste Mercy aus, um einen kraftvollen Schuss abzufeuern, der Schaden verursacht und Vengeance-Stacks anwendet. Mercy kann kritisch treffen (Crit), profitiert von Lifesteal und löst On-Hit-Effekte aus.","Passive: Mark enemies with Vengeance, increasing your damage against them.\nActive: Purify any enemies that are marked with Vengeance, dealing damage based on stacks and slowing for a duration.":"Passiv: Markiere Gegner mit Vengeance, wodurch dein Schaden gegen sie steigt.\nAktiv: Läutere alle mit Vengeance markierten Gegner, verursache Schaden abhängig von den Stacks und verlangsame (Slow) sie für eine Dauer.","Dash in your current movement direction, and gain power for a duration.":"Sprinte (Dash) in deine aktuelle Bewegungsrichtung und erhalte für eine Dauer Stärke.","Unleash a torrent of arrows and bullets in an area. Enemies take damage over the duration. You can cast Shadow Glide during this window.":"Entfessele einen Hagel aus Pfeilen und Kugeln in einem Bereich. Gegner erleiden über die Dauer Schaden. Während dieser Zeit kannst du Shadow Glide wirken.","Periodically become empowered, causing your next Basic Attack or Mercy to fire a Raven. The Raven explodes on impact, dealing Current Health damage to nearby enemies.":"Werde in regelmäßigen Abständen verstärkt, sodass dein nächster Standardangriff oder Mercy einen Raben abfeuert. Der Rabe explodiert beim Aufprall und verursacht bei nahen Gegnern Schaden in Höhe ihres aktuellen Lebens.","Archaeologist":"Archäologin","Seize control with Dekker, a support caster who uses her ionic energy to shift the tides of battle.":"Ergreife die Kontrolle mit Dekker, einer Support-Magierin, die ihre ionische Energie nutzt, um das Blatt im Kampf zu wenden.","Send an energy bolt from your staff.":"Sende einen Energieblitz von deinem Stab.","Launch a bouncing ball of energy, dealing damage and stunning enemies.":"Schleudere eine springende Energiekugel, die Gegnern Schaden zufügt und sie betäubt (Stun).","Release a drone that emits a beam of energy dealing damage and slowing all enemies hit.":"Setze eine Drohne frei, die einen Energiestrahl aussendet, der allen getroffenen Gegnern Schaden zufügt und sie verlangsamt (Slow).","Deploy a circular energy fence that prevents enemies from passing through.":"Errichte einen kreisförmigen Energiezaun, den Gegner nicht durchqueren können.","Summon a bot above the target location that blasts the ground dealing damage and slowing enemies. Enemies directly under the beam will be stunned.":"Beschwöre einen Bot über dem Zielort, der den Boden beschießt, Schaden verursacht und Gegner verlangsamt (Slow). Gegner direkt unter dem Strahl werden betäubt (Stun).","Jump while airborne to activate Rocket Boots, propelling you upward and granting movement speed to nearby allies.":"Springe in der Luft, um die Rocket Boots zu aktivieren, die dich nach oben katapultieren und nahen Verbündeten Bewegungstempo gewähren.","Gunslinger":"Revolverheld","Lock and load with TwinBlast, a gunner whose dual-wielded arsenal and rocket dashes keep him one step ahead of death and a clip ahead of his enemies.":"Lock and load mit TwinBlast, einem Schützen, dessen beidhändiges Arsenal und Raketensprints ihn dem Tod stets einen Schritt und seinen Feinden ein Magazin voraus halten.","Fire a cartrige of superheated plasma from each of the LUNARI 4.0s.":"Feuere aus jeder der LUNARI 4.0 eine Patrone aus überhitztem Plasma ab.","Launch a grenade that explodes upon contact with an enemy, dealing damage and slowing.":"Schieße eine Granate ab, die beim Kontakt mit einem Gegner explodiert, Schaden verursacht und verlangsamt (Slow).","Charge and fire two superheated piercing projectiles, each dealing damage.":"Lade zwei überhitzte, durchdringende Projektile auf und feuere sie ab, die jeweils Schaden verursachen.","Roll or dash in the direction of movement depending on if you're in the air.":"Rolle oder sprinte (Dash) in Bewegungsrichtung, je nachdem, ob du dich in der Luft befindest.","Set the LUNARI 4.0s to full auto, unleashing a barrage of bullets over three seconds that deals a massive amount of damage.":"Stelle die LUNARI 4.0 auf Vollautomatik und entfessele über drei Sekunden einen Kugelhagel, der massiven Schaden verursacht.","Casting an ability will cause your next basic attack to fire three times.":"Das Wirken einer Fähigkeit lässt deinen nächsten Standardangriff dreimal feuern.","Fallen Angel":"Gefallener Engel","Challenge the heavens with Serath, a melee carry whose holy fury is unleashed in a spectacle of divine retribution, smiting foes with a celestial barrage that bathes the battlefield in fire.":"Fordere mit Serath den Himmel heraus, einen Nahkampf-Carry, dessen heiliger Zorn sich in einem Schauspiel göttlicher Vergeltung entlädt und Feinde mit einem himmlischen Geschosshagel niederstreckt, der das Schlachtfeld in Feuer taucht.","Beat your foes into submission with your mace, The Nephilim.":"Prügle deine Feinde mit deinem Streitkolben The Nephilim in die Knie.","Clap your wings in front of you dealing damage and slowing. Cast speed increases with attack speed.":"Schlage vor dir mit den Flügeln, verursache Schaden und verlangsame Gegner. Die Zaubergeschwindigkeit steigt mit der Angriffsgeschwindigkeit.","Mark a target and vanish, striking enemies at their location. Each strike deals damage. Then, teleport to the marked enemy's location.":"Markiere ein Ziel und verschwinde, um Gegner an ihrem Standort anzugreifen. Jeder Angriff verursacht Schaden. Teleportiere dich anschließend zum Standort des markierten Gegners.","Rise up into the air and hover while targetting an area. Then, dive down and deal damage.":"Erhebe dich in die Luft und schwebe, während du ein Gebiet anvisierst. Stürze dich dann herab und verursache Schaden.","Take on your demonic form, dealing damage to nearby enemies and setting them ablaze. Gain movement speed, attack speed, and damage over time on your basic attacks.":"Nimm deine dämonische Gestalt an, verursache Schaden bei nahen Gegnern und setze sie in Brand. Erhalte Bewegungstempo, Angriffsgeschwindigkeit und Schaden über Zeit bei deinen Standardangriffen.","Takedowns on heroes leave behind an orb. Upon touching it, activate Heresy and reduce your current basic ability cooldowns.":"Takedowns auf Helden hinterlassen eine Kugel. Berührst du sie, aktivierst du Heresy und verringerst die aktuellen Cooldowns deiner Basisfähigkeiten.","Demon King":"Dämonenkönig","Flay your enemies with sharpened claws.":"Zerfetze deine Feinde mit geschärften Klauen.","Crush enemies in your gaping maw, damaging them while sustaining yourself.":"Zermalme Gegner in deinem klaffenden Maul, füge ihnen Schaden zu und stärke dich dabei selbst.","Launch the Demon's Eye at foes, revealing them as it spews damaging and slowing flames.":"Schleudere das Demon's Eye auf Feinde, das sie enthüllt, während es schadende und verlangsamende Flammen speit.","Fire a web, rooting and slowing enemies caught in it, or latching yourself to terrain.":"Feuere ein Netz ab, das darin gefangene Gegner mit Root belegt und verlangsamt, oder dich selbst am Gelände festhakt.","Open your maw wide, pulling in all enemies in your path to consume those that get too close.":"Öffne dein Maul weit und ziehe alle Gegner in deinem Weg heran, um jene zu verschlingen, die zu nahe kommen.","Gain Hunger through battle and become Awakened to your true demonic power.":"Gewinne im Kampf Hunger und erwache zu deiner wahren dämonischen Macht.","Gatekeeper":"Torwächterin","An indomitable force of pure power, Terra effortlessly charges through hordes of enemies while delivering powerful blows with her ancestral axe.":"Terra, eine unaufhaltsame Naturgewalt aus purer Kraft, pflügt mühelos durch Gegnerhorden und teilt dabei mit ihrer Ahnenaxt gewaltige Hiebe aus.","Cleave through your enemies with your battleaxe, Skullsplitter.":"Spalte deine Feinde mit deiner Streitaxt Skullsplitter.","Become Unstoppable before dashing forward, damaging and stunning the target hit.\n\nEmpowered: Gain a shield after hitting an enemy.":"Werde Unstoppable, bevor du nach vorn dashst, dem getroffenen Ziel Schaden zufügst und es mit Stun belegst.\n\nEmpowered: Erhalte einen Shield, nachdem du einen Gegner getroffen hast.","Spin your axe, striking all Enemies around you twice.\n\nEmpowered: Strike three times instead.":"Wirbele deine Axt herum und triff alle Gegner um dich herum zweimal.\n\nEmpowered: Triff stattdessen dreimal.","Throw a spectral axe, dealing damage. Enemies hit are slowed and have their Physical Armor reduced.\n\nEmpowered: Roots enemies hit for a duration.":"Wirf eine Geisteraxt, die Schaden verursacht. Getroffene Gegner werden verlangsamt und ihre physische Rüstung wird verringert.\n\nEmpowered: Belegt getroffene Gegner für eine Dauer mit Root.","Slam your helmet down, cleansing all debuffs, disabling nearby Enemy Towers and gain max Hersir stacks instantly. Additionally, you becomes buffed for a short duration.":"Schlage deinen Helm nieder, entferne alle Debuffs, deaktiviere nahe gegnerische Towers und erhalte sofort die maximalen Hersir-Stacks. Zusätzlich erhältst du für kurze Zeit einen Buff.","Gain bonus Armors while under Towers, and generate stacks when damaging Enemies.\n\nAt maximum stacks, Terra's next Basic Ability is Empowered with additional effects.":"Erhalte zusätzliche Rüstung, solange du dich unter Towers befindest, und generiere Stacks, wenn du Gegnern Schaden zufügst.\n\nBei maximalen Stacks wird Terras nächste Basisfähigkeit mit zusätzlichen Effekten Empowered.","Machinist":"Maschinist","Dominate with ingenuity as Gadget, an ingenious caster whose deployable tech disrupts enemy lines and controls the flow of the fight.":"Dominiere mit Erfindungsgeist als Gadget, ein genialer Caster, dessen einsetzbare Technik gegnerische Reihen durcheinanderbringt und den Kampfverlauf kontrolliert.","Electrify enemies with shock bolts from your generator.":"Elektrisiere Gegner mit Schockblitzen aus deinem Generator.","Release an airborne droid. Upon stopping, the droid slows and deals damage over time to enemies beneath it.":"Setze einen fliegenden Droiden frei. Sobald er anhält, verlangsamt er Gegner unter sich und verursacht Schaden über Zeit.","Launch a sticky mine that attaches to any nearby unit. After a delay the mine explodes, dealing damage.":"Verschieße eine Haftmine, die an jeder nahen Einheit haftet. Nach einer Verzögerung explodiert die Mine und verursacht Schaden.","Throw forward an electrical gate, granting allies that pass through it decaying movement speed. If an enemy passes through, the gate deals damage and roots them.":"Wirf ein elektrisches Tor nach vorn, das Verbündeten, die hindurchgehen, abklingendes Bewegungstempo verleiht. Passiert ein Gegner es, verursacht das Tor Schaden und belegt ihn mit Root.","Unleash your Tesla Dome, dealing damage and expanding over time. This damage reduces armour and slows for a duration.":"Entfessle deinen Tesla Dome, der Schaden verursacht und sich mit der Zeit ausdehnt. Dieser Schaden verringert die Rüstung und verlangsamt für eine Dauer.","Damaging Heroes and Killing Targets grants Data that permanently increases your Magical Power.":"Das Schädigen von Helden und das Töten von Zielen gewährt Data, das deine Magische Kraft dauerhaft erhöht.","Hustlers":"Die Hustler","Tear up the battlefield with pure power or take control with slows and displacements, with the ultimate flexible Hero pair, Grim.exe!":"Zerreiße das Schlachtfeld mit purer Kraft oder übernimm mit Slows und Verdrängungen die Kontrolle – mit dem ultimativ flexiblen Heldenduo Grim.exe!","Fire deadly bolts of electricity at your enemies with The Inverter.":"Feuere mit The Inverter tödliche Elektrizitätsblitze auf deine Gegner.","Activate a shield that blocks the next enemy ability.":"Aktiviere einen Shield, der die nächste gegnerische Fähigkeit blockt.","Fire an empowered shot forward that deals damage.\nIn Assault Mode, the shot displaces enemies.":"Feuere einen verstärkten Schuss nach vorn ab, der Schaden verursacht.\nIm Assault Mode verdrängt der Schuss Gegner.","Swap between Assault and Sentry Mode.\nSentry: Basic Attacks restore mana.\nAssault: Basic Attacks cost mana, but have increased range and deal extra damage.":"Wechsle zwischen Assault und Sentry Mode.\nSentry: Standardangriffe stellen Mana wieder her.\nAssault: Standardangriffe kosten Mana, haben aber mehr Reichweite und verursachen zusätzlichen Schaden.","Lock onto an enemy hero and launch an orb that passes through all terrain dealing massive damage.":"Erfasse einen gegnerischen Helden und feuere eine Kugel ab, die durch jedes Gelände fliegt und massiven Schaden verursacht.","Your basic attacks and abilities apply Pulsefire to Enemies. The next basic attack or ability will burst the Pulsefire dealing damage.":"Deine Standardangriffe und Fähigkeiten belegen Gegner mit Pulsefire. Der nächste Standardangriff oder die nächste Fähigkeit lässt das Pulsefire detonieren und verursacht Schaden.","Bounty Hunter":"Kopfgeldjäger","Exact vengeance with Revenant, an unholy marksman whose revolver reaps the souls of his targets, duelling them in otherworldly dimensions for ultimate stakes.":"Übe Vergeltung mit Revenant, einem unheiligen Schützen, dessen Revolver die Seelen seiner Ziele erntet und sie in jenseitigen Dimensionen im Duell um den ultimativen Einsatz stellt.","Eviscerate your enemies with your .90 hand cannon, Fate. Holds 4 rounds, the final round will always critically strike.":"Weide deine Feinde mit deiner Handkanone .90, Fate, aus. Fasst 4 Patronen, die letzte Patrone landet immer einen kritischen Treffer.","Passive: Increases critical strike damage and boost Fourth Shot damage.\n\nActive: Reload your hand cannon.":"Passiv: Erhöht den Schaden kritischer Treffer und verstärkt den Schaden des Fourth Shot.\n\nAktiv: Lade deine Handkanone nach.","Unleash ethereal missiles within a wide cone that home to a marked target or random enemies if none are marked.":"Entfessle ätherische Geschosse in einem breiten Kegel, die ein markiertes Ziel verfolgen – oder zufällige Gegner, falls keines markiert ist.","Scar the target enemy dealing damage and marking them for a duration. Marked enemies take additional damage and consumes stacks. Consuming all stacks roots the target.":"Zeichne den Zielgegner mit einer Narbe, verursache Schaden und markiere ihn für eine Dauer. Markierte Gegner erleiden zusätzlichen Schaden, wodurch Stacks verbraucht werden. Werden alle Stacks verbraucht, wird das Ziel mit Root belegt.","Revenant pulls himself and his target into the Nether Realm for a duration, stealing a portion of their powers. Gain increased gold from kills while inside the Nether Realm.":"Revenant zieht sich und sein Ziel für eine Dauer in die Nether Realm und stiehlt einen Teil von dessen Kräften. Erhalte mehr Gold durch Kills, solange du dich in der Nether Realm befindest.","Increase your power based on critical strike chance and attacks speed. Killing an enemy hero grants additional gold.":"Erhöhe deine Kraft basierend auf Crit-Chance und Angriffsgeschwindigkeit. Das Töten eines gegnerischen Helden gewährt zusätzliches Gold.","Guardian of the Heavens":"Wächter der Himmel","Storm the battlefield with Kwang, peerless swordsman and wielder of the legendary Heavenly Blade.":"Stürme mit Kwang das Schlachtfeld, dem unvergleichlichen Schwertkämpfer und Träger der legendären Heavenly Blade.","Electrify your foes with the Heavenly Blade.":"Elektrisiere deine Feinde mit der Heavenly Blade.","Light strikes the Heavenly Blade, dealing damage in an AoE.\nIf you are holding the blade, gain a shield.\nIf the blade is in the world, deal extra damage.":"Ein Blitz schlägt in die Heavenly Blade ein und verursacht Flächenschaden (AoE).\nHältst du die Klinge, erhältst du einen Shield.\nBefindet sich die Klinge in der Spielwelt, wird zusätzlicher Schaden verursacht.","Throw the Heavenly Blade to a location to deal damage. Enemies become tethered to the blade.":"Wirf die Heavenly Blade an eine Position, um Schaden zu verursachen. Gegner werden an die Klinge gebunden.","Dash forward dealing damage to all enemies passed through.\nIf the blade is in your path, knock up and deal extra damage to enemies.":"Dashe nach vorn und verursache Schaden bei allen Gegnern, die du durchquerst.\nLiegt die Klinge in deinem Weg, wirfst du Gegner per Knock-up hoch und verursachst zusätzlichen Schaden.","Teleport to the Heavenly Blade creating a massive electrical explosion dealing massive damage to all enemies.":"Teleportiere dich zur Heavenly Blade und erzeuge eine gewaltige elektrische Explosion, die allen Gegnern massiven Schaden zufügt.","Dealing ability damage will energise the Heavenly Blade. Whilst Energised, you gain attack speed and your basic attacks deal extra damage in an AoE around the target.":"Das Verursachen von Fähigkeitsschaden lädt die Heavenly Blade auf. Im Zustand Energised erhältst du Angriffsgeschwindigkeit, und deine Standardangriffe verursachen zusätzlichen Flächenschaden (AoE) um das Ziel.","The Impaler":"Der Pfähler","Drain your foes with Valmont, an everlasting, oppressive Vampire Lord. Serve Lilith, a powerful goddess captured in an unbreakable, ancient blade. Thrive in extended encounters and embrace the vengeance.":"Entziehe deinen Feinden mit Valmont die Kraft, einem unsterblichen, tyrannischen Vampirlord. Diene Lilith, einer mächtigen Göttin, die in einer unzerbrechlichen, uralten Klinge gefangen ist. Gedeihe in langen Gefechten und umarme die Rache.","Torture your enemies by firing powerful blood strikes.":"Foltere deine Feinde mit mächtigen Blutschlägen.","Bind an unfortunate Soul to you, dealing damage over time whilst slowing and grounding them. Steal attack speed from them whilst tethered.":"Binde eine unglückselige Seele an dich, verursache Schaden über Zeit und verlangsame sie, während du sie mit Grounding belegst. Stiehl ihr Angriffsgeschwindigkeit, solange sie angebunden ist.","Manifest replicas of your Blade. After a short delay, they sequentially launch forward, dealing damage in a small area.":"Beschwöre Abbilder deiner Klinge. Nach kurzer Verzögerung schießen sie nacheinander nach vorn und verursachen Schaden in einem kleinen Bereich.","Actively target Lilith dealing Damage to Enemies in an area whilst gaining Attack Speed. Whenever Bloodbound is leveled, the Damage of Hemophagias is increased.":"Visiere Lilith gezielt an, um Gegnern in einem Bereich Schaden zuzufügen und dabei Angriffsgeschwindigkeit zu erhalten. Immer wenn Bloodbound aufgelevelt wird, steigt der Schaden von Hemophagias.","Unleash terrifying swarms of bats that deal magical damage when hitting enemies. The Bats then return and heal Valmont.":"Entfessle furchterregende Fledermausschwärme, die bei Treffern auf Gegner magischen Schaden verursachen. Die Fledermäuse kehren anschließend zurück und heilen Valmont.","Lilith hunts her prey, striking Enemies damaged by you. Regenerate Mana by consuming souls of Enemies killed around Lilith. Restoration is incre
