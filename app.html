};
/* Tier thresholds. Scores from the guided questions spread between about 50 and 90, so the
   bands sit there: S+ is rare, most strong heroes land in A or B. */
const DEFAULT_TIERS = [{t: 'S+', min: 85}, {t: 'S', min: 78}, {t: 'A', min: 70}, {t: 'B', min: 62}, {t: 'C', min: 54}, {t: 'D', min: 0}];
const OLD_DEFAULT_TIERS = '92,86,78,68,55,0';
const CAT_DEF = {
  duel: {what: 'Isolated, direct combat at comparable resources.', yes: 'Duel damage, burst, sustained combat, self-sustain in the fight, outplay potential, direct kill pressure.', no: 'Not wave clear, rotation or global map impact.'},
  lane: {what: 'How well the hero controls a lane over time.', yes: 'Wave control, wave clear, poke, trading, sustain, lane priority, safe farm, putting the opponent under pressure.', no: 'Not simply “who wins the 1v1” again.'},
  skirmish: {what: '2v2 and 3v3 situations.', yes: 'Small river fights, fast rotations, smaller objective fights, target switching, follow-up, burst and mobility in a small fight.', no: 'Not full 5v5 fights.'},
  teamfight: {what: '4v4 and 5v5 fights.', yes: 'AoE impact, damage, fight control, frontline, engage, positioning, influencing several enemies or allies at once.', no: 'Not isolated picks.'},
  map: {what: 'Presence across the map.', yes: 'Rotation speed, roaming, mobility, response time, map presence, influencing other areas quickly.', no: 'Not strength once the hero has arrived.'},
  objective: {what: 'Total influence on objectives, not only objective damage.', yes: 'Damage, secure, setup, contest, zoning, objective fight impact. Different roles can earn a good score in different ways.', no: 'Not general teamfight strength away from objectives.'},
  safety: {what: 'Staying effective under pressure.', yes: 'Mobility, escape, self-peel, tankiness, defensive tools, range.', no: 'Not protection that comes from allies.'},
  utility: {what: 'What the hero does for the team. Support only.', yes: 'Crowd control, peel, engage, disengage, healing, shields, buffs, debuffs, ally protection, setup.', no: 'Never rated for Offlane, Jungle, Mid or Carry.'}
};
/* Question mode: category score = average(question scores) / 5 × 100. */
/* Two or three questions per category – only as many as are really different. They ask about results, not about one particular way of
   getting there, so a hero is not marked down for lacking a specific tool. Inside a category
   each question covers its own side (roughly: how much, how reliably, how independently),
   so nothing is counted twice. */
const QUESTIONS = {
  duel: ['How strong is the hero in an even 1v1?', 'How reliably does the hero win duels, whatever kind of opponent it is?', 'How well can the hero still turn a duel that starts badly?'],
  lane: ['How much pressure does the hero put on the lane opponent?', 'How well does the hero keep control of the wave?', 'How well does the hero hold the lane when the pressure is on them?'],
  skirmish: ['How much does the hero contribute to winning a 2v2 or 3v3?', 'How well does the hero work together with allies in a small fight?', 'How reliably does the hero have that impact, whoever the opponents are?'],
  teamfight: ['How strong is the hero in a 5v5 that their own team starts?', 'How strong is the hero in a 5v5 that the enemy team starts?'],
  map: ['How quickly does the hero get around the map?', 'How easily can the hero leave their own position to help elsewhere without losing much?'],
  objective: ['How much does the hero help the team take objectives?', 'How well does the hero do when both teams want the same objective?', 'How well can the hero take or threaten objectives without much help?'],
  safety: ['How hard is the hero to kill once enemies reach them?', 'How well can the hero avoid getting caught in the first place?', 'How well does the hero keep doing their job while under pressure?'],
  utility: ['How much does the hero help allies stay alive?', 'How much does the hero restrict what enemies can do?', 'How much does the hero create opportunities for the team?']
};
/* Some questions do not fit every role. A support does not farm the wave, shares the lane
   with a carry and does not take objectives alone, so Support has its own wording for those
   categories. Everything not listed here uses the general questions above. */
const QUESTIONS_ROLE = {
  Support: {
    lane: ['How much pressure does the hero put on the enemy duo in lane?', 'How well does the hero protect and enable their carry in lane?'],
    skirmish: ['How much does the hero help their team win a 2v2 or 3v3?', 'How reliably does the hero have that effect, whoever the opponents are?'],
    map: ['How quickly does the hero get around the map?', 'How easily can the hero leave their carry to help elsewhere without putting the carry at risk?'],
    objective: ['How much does the hero help the team take objectives?', 'How well does the hero do when both teams want the same objective?']
  }
};
const questionsFor = (k, role) => (QUESTIONS_ROLE[role] && QUESTIONS_ROLE[role][k]) || QUESTIONS[k];

/* ================================== STORE =================================
   Shared state (official data, community ratings) plus per-browser UI state. */
const LS_KEY = 'predrank-state', LS_LEGACY = 'pred-tierlist-v1', STATE_VERSION = 2;
const Store = {
  config: {weights: clone(DEFAULT_WEIGHTS), tiers: clone(DEFAULT_TIERS), featured: null, customPatches: [], currentPatch: null, demo: false, liveApi: null},
  evals: {},        // "<patch>:<role>" -> { heroId: {c:{cat:0..100, unrated = absent}, q?, status, at, by} }
  invalid: {},      // "<patch>:<role>/<heroId>" of stored evaluations for a role pred.gg does not list (ignored)
  ratings: {},      // userId -> { "<heroId>:<role>": 1..5 }
  audit: [],        // admin only
  legacy: null,     // data of the former manual tier list, kept isolated
  ui: {patch: null, role: 'Offlane', rkRole: 'Offlane', rankView: 'overview', uiv: 27, sort: 'rank', sortDir: 1, mx: 'score', my: 'wr', heroSort: 'name', fx: true, cmp: null, heroRole: {}},
  rev: 0,
  bump(){ this.rev++; App.invalidate(); },
  patches(){ return [...this.config.customPatches.filter(p => !SNAPSHOT.stats[p]), ...SNAP_PATCHES]; },
  patch(){ const all = this.patches(); return all.includes(this.ui.patch) ? this.ui.patch : (all.includes(this.config.currentPatch) ? this.config.currentPatch : SNAP_PATCHES[0]); }
};

/* ============================== PERSISTENCE ===============================
   localStorage is only a cache and the home of per-browser UI state. Old
   versions are migrated; anything that cannot be converted is kept as legacyData. */
const Persist = {
  load(){
    let raw = null; try { raw = JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) {}
    if (raw && raw.version === STATE_VERSION){
      if (raw.config) Store.config = Persist.cleanConfig(raw.config);
      if (raw.evals && typeof raw.evals === 'object') Store.evals = Persist.cleanEvals(raw.evals);
      if (raw.ratings && typeof raw.ratings === 'object') Store.ratings = raw.ratings;
      if (raw.ui && typeof raw.ui === 'object'){ Object.assign(Store.ui, raw.ui); if (Store.ui.uiv !== 27){ Store.ui.rankView = 'overview'; Store.ui.uiv = 27; } }
      if (raw.legacyData) Store.legacy = raw.legacyData;
    }
    if (!Store.legacy){               // v1 = manual drag-and-drop tier list
      try { const old = JSON.parse(localStorage.getItem(LS_LEGACY)); if (old && old.v === 1) Store.legacy = {version: 1, lists: old.lists || {}, players: old.players || [], custom: old.custom || []}; } catch (e) {}
    }
    if (!Store.ui.heroRole || typeof Store.ui.heroRole !== 'object') Store.ui.heroRole = {};
    if (!ROLES.includes(Store.ui.role)) Store.ui.role = 'Offlane';
  },
  save(){
    try { localStorage.setItem(LS_KEY, JSON.stringify({version: STATE_VERSION, config: Store.config, evals: Store.evals, ratings: Auth.id && Store.ratings[Auth.id] ? {[Auth.id]: Store.ratings[Auth.id]} : {}, ui: Store.ui, legacyData: Store.legacy})); } catch (e) {}
  },
  cleanConfig(c){
    const out = {weights: clone(DEFAULT_WEIGHTS), tiers: clone(DEFAULT_TIERS), featured: null, customPatches: [], currentPatch: null, demo: false, liveApi: null};
    if (!c || typeof c !== 'object') return out;
    ROLES.forEach(r => { const w = c.weights && c.weights[r]; if (w && Engine.validWeights(r, w)) out.weights[r] = Object.fromEntries(ROLE_CATS[r].map(k => [k, +w[k]])); });
    if (Array.isArray(c.tiers) && Engine.validTiers(c.tiers) && c.tiers.map(t => +t.min).join(',') !== OLD_DEFAULT_TIERS) out.tiers = c.tiers.map(t => ({t: String(t.t).slice(0, 3), min: +t.min}));   // the old default thresholds are replaced by the new ones
    if (c.featured && validHeroRole(c.featured.id, c.featured.role)) out.featured = {id: c.featured.id, role: c.featured.role};
    if (Array.isArray(c.customPatches)) out.customPatches = [...new Set(c.customPatches.map(cleanPatch).filter(Boolean))].slice(0, 40);
    if (c.currentPatch) out.currentPatch = cleanPatch(c.currentPatch);
    out.demo = !!c.demo;
    out.liveApi = cleanUrl(c.liveApi);   // public address of the live backend (never a secret)
    return out;
  },
  cleanEvals(all){
    const out = {};
    Object.keys(all).forEach(key => {
      const i = key.lastIndexOf(':'), patch = cleanPatch(key.slice(0, i)), role = key.slice(i + 1);
      if (i < 1 || !patch || !ROLES.includes(role) || !all[key] || typeof all[key] !== 'object') return;
      const set = {};
      Object.keys(all[key]).forEach(id => { const ev = Engine.cleanEval(id, role, all[key][id]); if (ev) set[id] = ev; else if (HERO[id] && !validHeroRole(id, role)) Store.invalid[patch + ':' + role + '/' + id] = 1; });
      if (Object.keys(set).length) out[patch + ':' + role] = set;
    });
    return out;
  }
};

/* ============================= RANKING ENGINE =============================
   Score = Σ(category rating × role weight). Tier and rank derive from the score.
   Live statistics and community ratings never enter this module. */
const Engine = {
  _memo: {}, _rev: -1,
  cache(){ if (this._rev !== Store.rev){ this._memo = {}; this._rev = Store.rev; } return this._memo; },
  validWeights(role, w){
    const cats = ROLE_CATS[role]; if (!w || typeof w !== 'object') return false;
    let sum = 0; for (const k of cats){ const v = +w[k]; if (!isFinite(v) || v < 0 || v > 100) return false; sum += v; }
    return Math.abs(sum - 100) < 1e-6;
  },
  validTiers(list){
    if (!Array.isArray(list) || list.length < 2) return false;
    for (let i = 0; i < list.length; i++){ const m = +list[i].min; if (!list[i].t || !isFinite(m) || m < 0 || m > 100) return false; if (i && m >= +list[i - 1].min) return false; }
    return +list[list.length - 1].min === 0;
  },
  /* Keeps only what belongs to the role: no duel for Support, no lane for Jungle, utility
     for Support only. A category that was never rated stays absent – it is not 50 and not 0.
     Status: incomplete (categories missing) → draft (all rated) → reviewed (public). */
  cleanEval(id, role, ev){
    if (!validHeroRole(id, role) || !ev || !ev.c || typeof ev.c !== 'object') return null;
    const c = {}, cats = ROLE_CATS[role];
    for (const k of cats){ const raw = ev.c[k]; if (raw == null || raw === '') continue; const v = +raw; if (isFinite(v)) c[k] = clamp(v, 0, 100); }
    const out = {c, status: 'incomplete', at: typeof ev.at === 'string' ? ev.at : null, by: typeof ev.by === 'string' ? ev.by : null};
    if (ev.q && typeof ev.q === 'object'){ const q = {}; for (const k of cats) if (Array.isArray(ev.q[k])){
        const all = ev.q[k].map(n => n == null || n === '' || !isFinite(+n) ? null : clamp(Math.round(+n), 0, 5)), n = questionsFor(k, role).length; q[k] = all.slice(0, n);
        /* A category that now has fewer questions than when it was answered: the surplus answers
           are dropped and the category score follows the remaining ones, so old and new
           evaluations are calculated the same way. */
        if (all.length > n && q[k].length === n && q[k].every(v => v != null)) c[k] = Math.round(q[k].reduce((a, b) => a + b, 0) / n / 5 * 100);
      }
      if (Object.keys(q).length) out.q = q; }
    if (!Object.keys(c).length && !out.q) return null;
    if (this.complete(c, role)) out.status = ['reviewed', 'draft', 'demo'].includes(ev.status) ? ev.status : 'draft';
    return out;
  },
  complete(c, role){ return ROLE_CATS[role].every(k => c[k] != null); },
  rated(c, role){ return ROLE_CATS[role].filter(k => c[k] != null); },
  /* Only complete evaluations with status "reviewed" are public. Demo placeholders count
     only while demo mode is switched on. Drafts never reach a ranking. */
  isPublic(ev, role){ return !!ev && this.complete(ev.c, role) && (ev.status === 'reviewed' || (ev.status === 'demo' && Store.config.demo)); },
  score(c, role){ const w = Store.config.weights[role]; let s = 0; for (const k of ROLE_CATS[role]) s += c[k] * w[k] / 100; return s; },
  /* Preview for the admin workspace: weighted mean of the categories rated so far.
     Equals score() once everything is rated. Never published under the name "official". */
  projected(c, role){ const w = Store.config.weights[role]; let s = 0, ws = 0; for (const k of ROLE_CATS[role]) if (c[k] != null){ s += c[k] * w[k]; ws += w[k]; } return ws ? s / ws : null; },
  /* Where a score would land in the published ranking of the role. */
  position(score, role, patch, exceptId){ return this.ranking(patch, role).filter(r => r.id !== exceptId && r.score > score).length + 1; },
  contributions(c, role){ const w = Store.config.weights[role]; return ROLE_CATS[role].map(k => ({cat: k, rating: c[k], weight: w[k], contribution: c[k] * w[k] / 100})); },
  tier(score){ for (const t of Store.config.tiers) if (score >= t.min) return t.t; return Store.config.tiers[Store.config.tiers.length - 1].t; },
  /* null while a question is unanswered */
  fromQuestions(arr){ return arr.length && arr.every(n => n != null) ? arr.reduce((a, b) => a + b, 0) / arr.length / 5 * 100 : null; },
  /* Ranking of one role in one patch: public evaluations only, full precision,
     ties broken by name. */
  ranking(patch, role){
    const memo = this.cache(), key = patch + ':' + role; if (memo[key]) return memo[key];
    const set = Store.evals[key] || {};
    const rows = Object.keys(set).filter(id => validHeroRole(id, role) && this.isPublic(set[id], role)).map(id => ({id, ev: set[id], score: this.score(set[id].c, role)}))
      .sort((a, b) => b.score - a.score || HERO[a.id].name.localeCompare(HERO[b.id].name));
    rows.forEach((r, i) => { r.rank = i + 1; r.tier = this.tier(r.score); });
    rows.byId = Object.fromEntries(rows.map(r => [r.id, r]));
    return memo[key] = rows;
  },
  entry(id, role, patch){ return this.ranking(patch, role).byId[id] || null; },
  olderPatch(patch, role){ const all = Store.patches(); for (let i = all.indexOf(patch) + 1; i > 0 && i < all.length; i++) if (this.ranking(all[i], role).length) return all[i]; return null; },
  /* Positive = moved up compared with the previous evaluated patch. */
  movement(id, role, patch){ const prev = this.olderPatch(patch, role); if (!prev) return null; const a = this.entry(id, role, patch), b = this.entry(id, role, prev); return a && b ? b.rank - a.rank : null; },
  history(id, role){ return Store.patches().map(p => { const e = this.entry(id, role, p); return e ? {patch: p, score: e.score, rank: e.rank, tier: e.tier} : null; }).filter(Boolean); },
  /* Latest complete evaluation of an older patch, whatever its status – for the admin workspace only. */
  rawPrevious(id, role, patch){ const all = Store.patches(); for (let i = all.indexOf(patch) + 1; i > 0 && i < all.length; i++){ const ev = (Store.evals[all[i] + ':' + role] || {})[id]; if (ev && this.complete(ev.c, role)) return {patch: all[i], ev, score: this.score(ev.c, role), status: ev.status}; } return null; },
  previous(id, role, patch){ const all = Store.patches(); for (let i = all.indexOf(patch) + 1; i > 0 && i < all.length; i++){ const e = this.entry(id, role, all[i]); if (e) return Object.assign({patch: all[i]}, e); } return null; }
};

/* ============================ PRED API ADAPTER ============================
   pred.gg is the external data source. Its GraphQL schema was inspected on
   09.10.2026: `heroes { slug name data { displayName roles classes icon } }` and
   `versions { id name patchType releaseDate }` answer without authentication;
   `hero.generalStatistic` / `hero.matchupStatistic` answer "Forbidden" without it.
   No token or key belongs in this file: statistics need a backend proxy. Until one
   exists (or whenever the network is unavailable) the embedded snapshot is served. */
const PredAdapter = {
  endpoint: 'https://pred.gg/gql',
  state: 'LOADING',      // LOADING | LIVE | STALE | SNAPSHOT | OFFLINE
  /* Prepared for later: URL of a backend proxy that holds the pred.gg credentials. It has to
     answer GET <url>?patch=<p> with {updatedAt, stats: {<heroId>: [winRate, banRate, pickRate, matches]}},
     the same shape as the embedded snapshot. No token is ever written into this file. */
  proxyUrl: null, liveStats: {}, liveAt: null,
  detail: '', checkedAt: null, rosterDiff: [], _inflight: null,
  snapshotAt: SNAPSHOT.statsFetched || SNAPSHOT.fetched,
  normaliseStat(a, scope){ return a ? {winRate: a[0], banRate: a[1], pickRate: a[2], matches: a[3], scope} : null; },
  getHeroes(){ return HEROES; },
  getHero(id){ return HERO[id] || null; },
  getPatchData(){ return Store.patches().map(p => ({id: p, name: PATCH_NAMES[p] || '', releaseDate: SNAPSHOT.dates[p] || null, hasStats: !!SNAPSHOT.stats[p]})); },
  /* Role-specific numbers exist for the snapshot's current patch; older patches are all roles combined. */
  getHeroStats(id, opts){
    const patch = opts && opts.patch, role = opts && opts.role;
    if (role && patch === SNAPSHOT.rolePatch && SNAPSHOT.roleStats[role] && SNAPSHOT.roleStats[role][id]) return this.normaliseStat(SNAPSHOT.roleStats[role][id], 'role');
    if (!role && this.liveStats[patch] && this.liveStats[patch][id]) return this.normaliseStat(this.liveStats[patch][id], 'all');
    const s = SNAPSHOT.stats[patch]; return s && s[id] ? this.normaliseStat(s[id], 'all') : null;
  },
  getHeroHistory(id){ return SNAP_PATCHES.map(p => { const s = this.getHeroStats(id, {patch: p}); return s ? Object.assign({patch: p}, s) : null; }).filter(Boolean); },
  getPlayer(){ return Promise.reject({code: 'AUTH_REQUIRED', message: 'Player data needs an authenticated pred.gg proxy.'}); },
  getMatches(){ return Promise.reject({code: 'AUTH_REQUIRED', message: 'Match data needs an authenticated pred.gg proxy.'}); },
  getMatchups(){ return Promise.reject({code: 'AUTH_REQUIRED', message: 'Matchup statistics need an authenticated pred.gg proxy.'}); },
  /* One request at a time, result cached; never throws into the UI. */
  refresh(force){
    if (this._inflight) return this._inflight;
    if (!force && this.checkedAt && Date.now() - this.checkedAt < 10 * 60000) return Promise.resolve(this.state);
    this.state = 'LOADING'; App.invalidate();
    const ctl = typeof AbortController === 'function' ? new AbortController() : null; const timer = setTimeout(() => ctl && ctl.abort(), 7000);
    this._inflight = fetch(this.endpoint, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({query: '{ heroes { slug data { displayName roles } } }'}), signal: ctl ? ctl.signal : undefined})
      .then(r => { if (!r.ok) throw {http: r.status}; return r.json(); })
      .then(j => {
        const list = j && j.data && j.data.heroes; if (!Array.isArray(list)) throw {shape: true};
        this.rosterDiff = list.filter(x => x && x.slug && !HERO[x.slug]).map(x => (x.data && x.data.displayName) || x.slug);
        this.state = 'SNAPSHOT'; this.detail = 'Hero roster checked against pred.gg just now. Statistics need an authenticated proxy, so the embedded snapshot is shown.';
        if (!this.proxyUrl) return;
        const patch = Store.patch();
        return fetch(this.proxyUrl + '?patch=' + encodeURIComponent(patch)).then(r => r.ok ? r.json() : null).then(d => {
          if (!d || !d.stats || typeof d.stats !== 'object') return;
          this.liveStats[patch] = d.stats; this.liveAt = d.updatedAt || new Date().toISOString();
          this.state = Date.now() - new Date(this.liveAt).getTime() > 6 * 3600000 ? 'STALE' : 'LIVE'; this.detail = 'Statistics served by the proxy.';
        }).catch(() => {});
      })
      .catch(e => {
        this.state = 'OFFLINE';
        this.detail = e && e.http ? 'pred.gg answered with HTTP ' + e.http + '.' : e && e.shape ? 'pred.gg answered in an unexpected shape.' : 'pred.gg cannot be reached from this page.';
      })
      .then(() => { clearTimeout(timer); this.checkedAt = Date.now(); this._inflight = null; App.invalidate(); return this.state; });
    return this._inflight;
  },
  /* Snapshot numbers are never called live. */
  statusLine(){
    const snap = fmtDate(this.snapshotAt);
    if (this.state === 'LIVE' || this.state === 'STALE') return 'pred.gg data · ' + this.state + ' · updated ' + timeAgo(this.liveAt);
    if (this.state === 'SNAPSHOT') return 'pred.gg data · SNAPSHOT · updated ' + snap;
    if (this.state === 'LOADING') return 'pred.gg data · CHECKING · snapshot of ' + snap;
    return 'pred.gg data · OFFLINE · snapshot of ' + snap;
  }
};

/* ================================== AUTH ==================================
   The hosted provider is Supabase Auth; identity comes from the signed-in account,
   and the admin role is checked against the shared database on the server. The
   every write is checked again by the database's access rules on the server.
   There is no password anywhere in this file. To use another provider later (Supabase
   Auth, a Cloudflare Worker session), replace the body of init(): it only has to fill
   id, name and role from a server-verified session; everything else reads Auth.role. Opened as a plain file there is no
   provider at all; the only option then is the clearly separated local
   development mode, which protects nothing and shares nothing. */
const Auth = {
  provider: PredSupabase ? 'supabase' : 'none', id: null, name: '', role: 'guest', ready: false, dev: false, user: null,
  get isAdmin(){ return this.role === 'admin'; },
  async refreshRole(){
    if (!PredSupabase || !this.id){ this.role = this.id ? 'user' : 'guest'; return this.role; }
    try {
      const {data, error} = await PredSupabase.from('admins').select('user_id').eq('user_id', this.id).maybeSingle();
      if (error && error.code !== 'PGRST116') throw error;
      this.role = data ? 'admin' : 'user';
    } catch (e) { this.role = 'user'; }
    return this.role;
  },
  async setUser(u){
    this.user = u || null; this.id = u && u.id ? u.id : null;
    this.name = u ? ((u.user_metadata && (u.user_metadata.display_name || u.user_metadata.full_name || u.user_metadata.name)) || u.email || '') : '';
    await this.refreshRole();
    this.ready = true; App.invalidate();
  },
  async init(){
    if (!PredSupabase){
      this.provider = 'none';
      try { if (sessionStorage.getItem('predrank-dev') === '1') this.enableDev(true); } catch (e) {}
      this.ready = true; App.invalidate(); return;
    }
    this.provider = 'supabase';
    try {
      const {data} = await PredSupabase.auth.getSession();
      await this.setUser(data && data.session ? data.session.user : null);
      PredSupabase.auth.onAuthStateChange((_event, session) => {
        setTimeout(async () => { await this.setUser(session ? session.user : null); await Sync.init(true); }, 0);
      });
    } catch (e) { await this.setUser(null); }
  },
  async signIn(email, password){
    if (!PredSupabase) throw new Error('Hosted sign-in is unavailable.');
    const {error} = await PredSupabase.auth.signInWithPassword({email: String(email || '').trim(), password: String(password || '')});
    if (error) throw error; return true;
  },
  async signUp(email, password){
    if (!PredSupabase) throw new Error('Hosted sign-up is unavailable.');
    const {data, error} = await PredSupabase.auth.signUp({email: String(email || '').trim(), password: String(password || '')});
    if (error) throw error;
    return !!(data && data.session);
  },
  async signOut(){ if (PredSupabase) await PredSupabase.auth.signOut(); },
  async claimOwner(){
    if (!PredSupabase || !this.id) throw new Error('Sign in first.');
    const {data, error} = await PredSupabase.rpc('claim_initial_admin');
    if (error) throw error;
    await this.refreshRole();
    if (this.isAdmin) await Sync.bootstrapFromLocal();
    App.invalidate(); return !!data;
  },
  enableDev(silent){
    if (this.provider !== 'none') return;
    this.dev = true; this.id = 'local-dev'; this.name = 'Local developer'; this.role = 'admin';
    try { sessionStorage.setItem('predrank-dev', '1'); } catch (e) {}
    if (!silent){ toast('Local development mode on. Nothing here is secured or shared.'); App.invalidate(); }
  },
  disableDev(){ this.dev = false; this.id = null; this.name = ''; this.role = 'guest'; try { sessionStorage.removeItem('predrank-dev'); } catch (e) {} App.invalidate(); },
  requireAdmin(){ if (!this.isAdmin){ toast('Access denied. Admin role required.'); throw new Error('forbidden'); } }
};

/* ============================ SYNC (shared store) =========================
   config/main            official settings        read: everyone, write: admin
   evals/<patch>:<role>   official evaluations     read: everyone, write: admin
   ratings/<userId>       one document per user    read: everyone, write: that user (admin may moderate)
   audit/<id>             admin actions            read + write: admin
   The rules are declared at publish time and enforced on the server. */
const Sync = {
  db: PredSupabase, online: false, denied: false, dirty: new Set(), timers: {}, channels: [],
  stop(){
    if (PredSupabase) this.channels.forEach(ch => { try { PredSupabase.removeChannel(ch); } catch (e) {} });
    this.channels = [];
  },
  async init(restart){
    this.db = PredSupabase;
    if (restart) this.stop();
    if (!this.db){ this.online = false; App.invalidate(); return; }
    const fail = () => { this.online = false; App.invalidate(); };
    try {
      const [cfg, evs, ratings] = await Promise.all([
        this.db.from('app_config').select('data').eq('id','main').maybeSingle(),
        this.db.from('official_evals').select('id,data'),
        this.db.from('community_ratings').select('user_id,data')
      ]);
      if (cfg.error || evs.error || ratings.error) throw (cfg.error || evs.error || ratings.error);
      const cd = cfg.data && cfg.data.data;
      if (cd && typeof cd === 'object' && Object.keys(cd).length) Store.config = Persist.cleanConfig(cd);
      const nextE = {};
      (evs.data || []).forEach(row => { if (row && row.id && row.data && row.data.h) nextE[row.id] = row.data.h; });
      if (Object.keys(nextE).length) Store.evals = Persist.cleanEvals(nextE);
      const nextR = {};
      (ratings.data || []).forEach(row => { if (row && row.user_id && row.data && row.data.r) nextR[row.user_id] = Ratings.clean(row.data.r); });
      if (Auth.id && Store.ratings[Auth.id] && !nextR[Auth.id]) nextR[Auth.id] = Store.ratings[Auth.id];
      Store.ratings = nextR;
      if (Auth.isAdmin){
        const au = await this.db.from('audit_log').select('*').order('created_at', {ascending:false}).limit(300);
        if (!au.error) Store.audit = (au.data || []).map(r => ({_id:r.id, actor:r.actor, action:r.action, entity:r.entity, before:r.before_data, after:r.after_data, ts:r.created_at}));
      } else Store.audit = [];
      Persist.save(); Store.bump(); this.online = true;
      this.subscribe();
    } catch (e) { console.warn('Shared sync init failed', e); this.online = false; }
    App.invalidate();
  },
  subscribe(){
    this.stop(); if (!this.db) return;
    const reloadConfig = async () => { const {data} = await this.db.from('app_config').select('data').eq('id','main').maybeSingle(); const d=data&&data.data; if(d&&Object.keys(d).length){Store.config=Persist.cleanConfig(d);Persist.save();Store.bump();} };
    const reloadEvals = async () => { const {data}=await this.db.from('official_evals').select('id,data'); const n={}; (data||[]).forEach(r=>{if(r.data&&r.data.h)n[r.id]=r.data.h}); Store.evals=Persist.cleanEvals(n);Persist.save();Store.bump(); };
    const reloadRatings = async () => { const {data}=await this.db.from('community_ratings').select('user_id,data'); const n={}; (data||[]).forEach(r=>{if(r.data&&r.data.r)n[r.user_id]=Ratings.clean(r.data.r)}); Store.ratings=n;Persist.save();Store.bump(); };
    const ch = this.db.channel('pred-rank-shared-' + Math.random().toString(36).slice(2))
      .on('postgres_changes',{event:'*',schema:'public',table:'app_config'},reloadConfig)
      .on('postgres_changes',{event:'*',schema:'public',table:'official_evals'},reloadEvals)
      .on('postgres_changes',{event:'*',schema:'public',table:'community_ratings'},reloadRatings);
    if (Auth.isAdmin) ch.on('postgres_changes',{event:'*',schema:'public',table:'audit_log'},async()=>{ const {data}=await this.db.from('audit_log').select('*').order('created_at',{ascending:false}).limit(300); Store.audit=(data||[]).map(r=>({_id:r.id,actor:r.actor,action:r.action,entity:r.entity,before:r.before_data,after:r.after_data,ts:r.created_at}));Store.bump(); });
    ch.subscribe(status => { this.online = status === 'SUBSCRIBED' || this.online; App.invalidate(); });
    this.channels.push(ch);
  },
  async bootstrapFromLocal(){
    if (!this.db || !Auth.isAdmin) return;
    const cfg = await this.db.from('app_config').select('data').eq('id','main').maybeSingle();
    if (!cfg.error && (!cfg.data || !cfg.data.data || !Object.keys(cfg.data.data).length)) await this.db.from('app_config').upsert({id:'main',data:clone(Store.config),updated_at:new Date().toISOString(),updated_by:Auth.id});
    const cnt = await this.db.from('official_evals').select('id',{count:'exact',head:true});
    if (!cnt.error && !cnt.count){
      for (const key of Object.keys(Store.evals)) await this.db.from('official_evals').upsert({id:key,data:{h:clone(Store.evals[key]),at:new Date().toISOString()},updated_at:new Date().toISOString(),updated_by:Auth.id});
    }
    await this.init(true);
  },
  push(path, body){
    if (!this.db) return;
    this.dirty.add(path); clearTimeout(this.timers[path]);
    this.timers[path] = setTimeout(async () => {
      try {
        const data = body(); let q;
        if (path === 'config/main') q = data ? this.db.from('app_config').upsert({id:'main',data,updated_at:new Date().toISOString(),updated_by:Auth.id}) : Promise.resolve({error:null});
        else if (path.startsWith('evals/')) { const id=path.slice(6); q = data ? this.db.from('official_evals').upsert({id,data,updated_at:new Date().toISOString(),updated_by:Auth.id}) : this.db.from('official_evals').delete().eq('id',id); }
        else if (path.startsWith('ratings/')) { const uid=path.slice(8); q = data ? this.db.from('community_ratings').upsert({user_id:uid,data,updated_at:new Date().toISOString()}) : this.db.from('community_ratings').delete().eq('user_id',uid); }
        else q = Promise.resolve({error:null});
        const res = await q; if (res && res.error) throw res.error;
        this.denied = false; this.online = true;
      } catch (e) {
        console.warn('Shared save failed', e); this.denied = true;
        toast(e && (e.code === '42501' || e.code === 'PGRST301') ? 'The server refused this change: your access level does not allow it.' : 'Saving failed. Check your connection and try again.');
        if (path.startsWith('ratings/') && Auth.id) await this.init(true);
      }
      this.dirty.delete(path); App.invalidate();
    }, 500);
    App.invalidate();
  },
  pushConfig(){ this.push('config/main', () => clone(Store.config)); },
  pushEvals(key){ this.push('evals/' + key, () => Store.evals[key] && Object.keys(Store.evals[key]).length ? {h: clone(Store.evals[key]), at: new Date().toISOString()} : null); },
  pushRatings(uid){ this.push('ratings/' + uid, () => Store.ratings[uid] && Object.keys(Store.ratings[uid]).length ? {r: clone(Store.ratings[uid]), at: new Date().toISOString()} : null); },
  async addAudit(entry){
    if (!this.db || !Auth.isAdmin){ Store.audit.unshift(entry); Store.audit = Store.audit.slice(0,300); return; }
    const {error}=await this.db.from('audit_log').insert({actor:Auth.id,action:entry.action,entity:entry.entity,before_data:entry.before==null?null:entry.before,after_data:entry.after==null?null:entry.after,created_at:entry.ts||new Date().toISOString()});
    if(error) console.warn('Audit write failed',error);
  }
};

/* ============================ COMMUNITY RATING ============================
   1–5 stars per hero + role, one active rating per user (stored in that user's
   own document, so a second vote replaces the first). Completely separate from
   the role score: nothing in the Ranking Engine reads these values. */
const Ratings = {
  _memo: {}, _rev: -1,
  key: (id, role) => id + ':' + role,
  clean(r){ const out = {}; Object.keys(r).slice(0, 400).forEach(k => { const i = k.lastIndexOf(':'), n = Math.round(+r[k]); if (validHeroRole(k.slice(0, i), k.slice(i + 1)) && n >= 1 && n <= 5) out[k] = n; }); return out; },
  aggregate(id, role){
    if (this._rev !== Store.rev){ this._memo = {}; this._rev = Store.rev; }
    const key = this.key(id, role); if (this._memo[key]) return this._memo[key];
    const dist = [0, 0, 0, 0, 0]; let sum = 0, count = 0;
    Object.values(Store.ratings).forEach(r => { const n = r[key]; if (n >= 1 && n <= 5){ dist[n - 1]++; sum += n; count++; } });
    return this._memo[key] = {avg: count ? sum / count : null, count, dist};
  },
  mine(id, role){ return Auth.id && Store.ratings[Auth.id] ? Store.ratings[Auth.id][this.key(id, role)] || 0 : 0; },
  set(id, role, n){
    if (!Auth.id){ toast('Sign in to rate heroes.'); return false; }
    n = Math.round(+n); if (!validHeroRole(id, role) || !(n >= 0 && n <= 5)) return false;
    const mine = Store.ratings[Auth.id] = Object.assign({}, Store.ratings[Auth.id]);
    if (n === 0) delete mine[this.key(id, role)]; else mine[this.key(id, role)] = n;
    Persist.save(); Sync.pushRatings(Auth.id); Store.bump();
    toast(n ? 'Your rating: ' + n + ' / 5 — ' + HERO[id].name + ', ' + ROLE_LABEL[role] : 'Rating removed.');
    return true;
  },
  total(){ let n = 0; Object.values(Store.ratings).forEach(r => n += Object.keys(r).length); return n; }
};

/* ================================== ADMIN =================================
   Every operation checks the role here and is checked again by the server rules. */
const Admin = {
  audit(action, entity, before, after){ Sync.addAudit({actor: Auth.id || 'unknown', action, entity, before: before == null ? null : before, after: after == null ? null : after, ts: new Date().toISOString()}); },
  setWeights(role, w){
    Auth.requireAdmin(); if (!ROLES.includes(role) || !Engine.validWeights(role, w)){ toast('Role weights must equal 100%.'); return false; }
    const before = clone(Store.config.weights[role]), after = Object.fromEntries(ROLE_CATS[role].map(k => [k, +w[k]]));
    Store.config.weights[role] = after; this.audit('weights.update', role, before, after); this.commitConfig(); toast(ROLE_LABEL[role] + ' weights saved. Rankings recalculated.'); return true;
  },
  setTiers(list){
    Auth.requireAdmin(); if (!Engine.validTiers(list)){ toast('Thresholds must fall from top to bottom and end at 0.'); return false; }
    const before = clone(Store.config.tiers); Store.config.tiers = list.map(t => ({t: t.t, min: +t.min}));
    this.audit('tiers.update', 'thresholds', before, clone(Store.config.tiers)); this.commitConfig(); toast('Tier thresholds saved.'); return true;
  },
  commitConfig(){ Persist.save(); Sync.pushConfig(); Store.bump(); },
  /* quiet = autosave: writes an audit entry only when the status changes, not for every keystroke. */
  saveEval(id, role, patch, c, status, q, quiet){
    Auth.requireAdmin(); patch = cleanPatch(patch);
    const ev = Engine.cleanEval(id, role, {c, q, status, at: new Date().toISOString(), by: Auth.id});
    if (!ev || !Store.patches().includes(patch)){ toast('This hero, role and patch combination is not valid.'); return false; }
    if (status === 'reviewed' && ev.status !== 'reviewed'){ toast('Rate every category before publishing.'); return false; }
    const key = patch + ':' + role, set = Store.evals[key] = Object.assign({}, Store.evals[key]), before = set[id] ? clone(set[id].c) : null, was = set[id] ? set[id].status : null;
    set[id] = ev; if (!quiet || was !== ev.status) this.audit('evaluation.' + (ev.status === 'reviewed' ? 'publish' : 'save'), id + ' / ' + role + ' / ' + patch, before, Object.assign({status: ev.status}, ev.c));
    Persist.save(); Sync.pushEvals(key); Store.bump(); return true;
  },
  deleteEval(id, role, patch){
    Auth.requireAdmin(); const key = patch + ':' + role; if (!Store.evals[key] || !Store.evals[key][id]) return;
    const set = Object.assign({}, Store.evals[key]), before = clone(set[id].c); delete set[id];
    if (Object.keys(set).length) Store.evals[key] = set; else delete Store.evals[key];
    this.audit('evaluation.delete', id + ' / ' + role + ' / ' + patch, before, null); Persist.save(); Sync.pushEvals(key); Store.bump();
  },
  /* Copies as "draft" so that an old opinion is never silently presented as reviewed for a new patch. */
  copyFromPrevious(role, patch, onlyId){
    Auth.requireAdmin(); const key = patch + ':' + role, set = Store.evals[key] = Object.assign({}, Store.evals[key]); let n = 0, from = null;
    heroesOfRole(role).forEach(x => { if ((onlyId && x.id !== onlyId) || set[x.id]) return; const pv = Engine.rawPrevious(x.id, role, patch); if (!pv) return;
      const ev = clone(pv.ev); ev.status = ev.status === 'demo' ? 'demo' : 'draft'; ev.at = new Date().toISOString(); ev.by = Auth.id; set[x.id] = ev; n++; from = pv.patch; });
    if (n){ this.audit('evaluation.copy', role + ' → ' + patch, null, n + ' copied as draft'); Persist.save(); Sync.pushEvals(key); Store.bump(); } else if (!Object.keys(set).length) delete Store.evals[key];
    toast(n ? n + ' evaluation' + (n > 1 ? 's' : '') + ' copied as draft — review before publishing.' : 'Nothing to copy.'); return n;
  },
  setFeatured(id, role){ Auth.requireAdmin(); const before = Store.config.featured; Store.config.featured = id && validHeroRole(id, role) ? {id, role} : null; this.audit('settings.featured', 'home', before, Store.config.featured); this.commitConfig(); },
  addPatch(v){ Auth.requireAdmin(); v = cleanPatch(v); if (!v || Store.patches().includes(v)){ toast('Enter a new patch name, for example 1.18.'); return false; } Store.config.customPatches.unshift(v); this.audit('patch.add', v, null, v); this.commitConfig(); return true; },
  setLiveApi(v){ Auth.requireAdmin(); const url = v ? cleanUrl(v) : null; if (v && !url){ toast('Enter a full https address, for example https://axiom-live.example.workers.dev'); return false; }
    const before = Store.config.liveApi; Store.config.liveApi = url; this.audit('settings.liveApi', 'live backend', before, url); this.commitConfig(); LiveAdapter.refresh(true); return true; },
  setCurrentPatch(v){ Auth.requireAdmin(); if (!Store.patches().includes(v)) return; const before = Store.config.currentPatch; Store.config.currentPatch = v; this.audit('patch.current', 'default patch', before, v); this.commitConfig(); },
  /* Placeholder numbers so the product can be seen filled. Marked DEMO everywhere, removable in one step. */
  loadDemo(patch){
    Auth.requireAdmin(); let n = 0;
    const rnd = s => { let x = 2166136261; for (let i = 0; i < s.length; i++){ x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return ((x >>> 0) % 1000) / 1000; };
    ROLES.forEach(role => { const key = patch + ':' + role, set = Store.evals[key] = Object.assign({}, Store.evals[key]);
      heroesOfRole(role).forEach(x => { if (set[x.id]) return; const base = 60 + rnd(x.id + role) * 26, c = {}; ROLE_CATS[role].forEach(k => c[k] = Math.round(clamp(base + (rnd(x.id + role + k) - .5) * 30, 35, 98))); set[x.id] = {c, status: 'demo', at: new Date().toISOString(), by: Auth.id}; n++; });
      Sync.pushEvals(key); });
    Store.config.demo = true; this.audit('demo.load', patch, null, n + ' placeholder evaluations'); this.commitConfig(); toast(n + ' demo evaluations loaded for patch ' + patch + '.');
  },
  clearDemo(){
    Auth.requireAdmin(); let n = 0;
    Object.keys(Store.evals).forEach(key => { const set = Object.assign({}, Store.evals[key]); let hit = false; Object.keys(set).forEach(id => { if (set[id].status === 'demo'){ delete set[id]; n++; hit = true; } }); if (!hit) return; if (Object.keys(set).length) Store.evals[key] = set; else delete Store.evals[key]; Sync.pushEvals(key); });
    Store.config.demo = false; this.audit('demo.clear', 'all patches', n + ' placeholder evaluations', null); this.commitConfig(); toast(n + ' demo evaluations removed.');
  },
  deleteUserRatings(uid){ Auth.requireAdmin(); if (!Store.ratings[uid]) return; const before = Object.keys(Store.ratings[uid]).length; const next = Object.assign({}, Store.ratings); delete next[uid]; Store.ratings = next; this.audit('community.delete', 'ratings of ' + uid, before + ' ratings', null); Sync.pushRatings(uid); Store.bump(); toast('Ratings removed.'); },
  exportConfig(){ return btoa(unescape(encodeURIComponent(JSON.stringify({predrank: STATE_VERSION, config: Store.config, evals: Store.evals})))); },
  importConfig(code){
    Auth.requireAdmin(); let d; try { d = JSON.parse(decodeURIComponent(escape(atob(String(code).trim())))); } catch (e) { d = null; }
    if (!d || d.predrank !== STATE_VERSION){ toast('This is not a valid AXIOM backup code.'); return false; }
    const before = Object.keys(Store.evals); Store.config = Persist.cleanConfig(d.config); Store.evals = Persist.cleanEvals(d.evals || {});
    [...new Set([...before, ...Object.keys(Store.evals)])].forEach(k => Sync.pushEvals(k));
    this.audit('config.import', 'backup', null, Object.keys(Store.evals).length + ' evaluation sets'); this.commitConfig(); toast('Backup imported.'); return true;
  }
};

      [/^Own evaluation · patch (.+)$/, 'Eigene Bewertung · Patch $1'], [/^of (\d+) rated · (.+)$/, 'von $1 bewerteten · $2'], [/^All roles · patch (.+?) vs (.+)$/, 'Alle Rollen · Patch $1 ggü. $2'], [/^All roles · patch (.+)$/, 'Alle Rollen · Patch $1'],
      [/^AXR · (.+)$/, 'AXR · $1'], [/^Ranking context · (.+)$/, 'Ranking-Umfeld · $1'], [/^Average (Offlane|Jungle|Mid|Carry|Support)$/, 'Ø $1'], [/^(Offlane|Jungle|Mid|Carry|Support) · pred\.gg$/, '$1 · pred.gg'],
      [/^Only the roles pred\.gg lists for (.+)\. Win rate in the role, patch (.+)\.$/, 'Nur die Rollen, die pred.gg für $1 führt. Winrate in der Rolle, Patch $2.'],
      [/^No ranking yet for (.+) in patch (.+)\.$/, 'Noch kein Ranking für $1 in Patch $2.'], [/^The category profile appears once (.+) is evaluated as (.+)\.$/, 'Das Kategorie-Profil erscheint, sobald $1 als $2 bewertet ist.'],
      [/^Pick (.+) · Ban (.+)$/, 'Pick $1 · Ban $2'], [/^Recommended skill order, level 1 to (\d+)$/, 'Empfohlene Skill-Reihenfolge, Level 1 bis $1'], [/^(.+) win rate by patch, all roles$/, 'Winrate von $1 nach Patch, alle Rollen'],
      [/^(.+) \(solid white\) against the average of all rated (.+) heroes \(dashed gold\)$/, '$1 (weiß, durchgezogen) gegen den Durchschnitt aller bewerteten $2-Helden (gold, gestrichelt)'],
      [/^Patch (.+) · (\d+) heroes · (\d+) roles$/, 'Patch $1 · $2 Helden · $3 Rollen'], [/^In focus · (.+)$/, (m, a) => 'Im Fokus · ' + a],

/* ================================= CHARTS =================================
   Hand-written SVG, monochrome. Every chart carries a text alternative. */
const Charts = {
  /* series: [{c:{cat:0..100}, cls:''|'b', name}] drawn over the categories of one role (or a given list). */
  /* opts.big: larger labels with the value underneath, for small containers such as the admin preview. */
  radar(series, cats, label, opts){
    const big = !!(opts && opts.big), W = 520, cx = W / 2, cy = W / 2, R = big ? 150 : 172, n = cats.length;
    const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n, r = R * v / 100; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
    const poly = v => cats.map((_, i) => pt(i, typeof v === 'function' ? v(i) : v).map(x => x.toFixed(1)).join(',')).join(' ');
    const svg = S('svg', {class: 'radar' + (big ? ' big' : ''), viewBox: big ? '-110 -10 740 550' : '0 0 ' + W + ' ' + W, role: 'img', 'aria-label': label});
    [25, 50, 75, 100].forEach(v => svg.append(S('polygon', {class: 'grid', points: poly(v)})));
    cats.forEach((k, i) => { const [x, y] = pt(i, 100), [lx, ly] = pt(i, 121);
      svg.append(S('line', {class: 'axis', x1: cx, y1: cy, x2: x.toFixed(1), y2: y.toFixed(1)}));
      const anchor = Math.abs(lx - cx) < 12 ? 'middle' : lx < cx ? 'end' : 'start';
      if (!big){ svg.append(S('text', {x: lx.toFixed(1), y: (ly + 3).toFixed(1), 'text-anchor': anchor}, CAT[k].short)); return; }
      const v = series[0].c[k], up = ly < cy - 20 ? -22 : 4;
      const fv = n => n == null ? '—' : String(Math.round(n));
      svg.append(S('text', {x: lx.toFixed(1), y: (ly + up).toFixed(1), 'text-anchor': anchor}, CAT[k].short), S('text', {class: 'val', x: lx.toFixed(1), y: (ly + up + 36).toFixed(1), 'text-anchor': anchor}, S('tspan', null, fv(v)), series[1] ? S('tspan', {class: 'b'}, ' / ' + fv(series[1].c[k])) : null)); });
    series.forEach(s => {
      svg.append(S('polygon', {class: 'shape ' + (s.cls || ''), points: poly(i => s.c[cats[i]] == null ? 0 : s.c[cats[i]])}));
      cats.forEach((k, i) => { if (s.c[k] == null) return; const [x, y] = pt(i, s.c[k]); svg.append(S('circle', {class: 'dot ' + (s.cls || ''), cx: x.toFixed(1), cy: y.toFixed(1), r: 2.6})); });
    });
    return svg;
  },
  /* Small trend charts. opts.onPick(i|null, clicked) → returns the index to mark; opts.labels/fmt for the hover label. */
  spark(values, opts){
    const o = opts || {}, W = 260, H = 56, vals = values.map(v => v == null ? null : v), ok = vals.filter(v => v != null); if (ok.length < 2) return null;
    const min = Math.min(...ok), max = Math.max(...ok), span = max - min || 1, n = vals.length;
    const pts = vals.map((v, i) => v == null ? null : [i / (n - 1) * W, H - 8 - (v - min) / span * (H - 20)]);
    const d = pts.filter(Boolean).map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const svg = S('svg', {class: 'spark' + (o.onPick ? ' pickable' : ''), viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none', role: 'img', 'aria-label': 'Trend from ' + ok[0].toFixed(1) + ' to ' + ok[ok.length - 1].toFixed(1)});
    const grad = S('linearGradient', {id: 'sparkfill', x1: 0, y1: 0, x2: 0, y2: 1}, S('stop', {offset: 0, 'stop-color': '#d8c37a', 'stop-opacity': .22}), S('stop', {offset: 1, 'stop-color': '#d8c37a', 'stop-opacity': 0}));
    svg.append(S('defs', null, grad), S('path', {class: 'a', d: d + ' L' + W + ' ' + H + ' L0 ' + H + ' Z'}), S('path', {class: 'l', d}));
    if (!o.onPick) return svg;
    const guide = S('line', {class: 'guide', y1: 0, y2: H}), dot = S('circle', {class: 'mk', r: 3.4});
    svg.append(guide, dot);
    const mark = i => { const p = pts[i]; if (!p) return; guide.setAttribute('x1', p[0].toFixed(1)); guide.setAttribute('x2', p[0].toFixed(1)); dot.setAttribute('cx', p[0].toFixed(1)); dot.setAttribute('cy', p[1].toFixed(1)); svg.classList.toggle('hot', i !== n - 1); };
    Charts.hits(svg, n, W, H, (i, click) => mark(o.onPick(i, click)), o);
    mark(n - 1);
    return svg;
  },
  bars(values, opts){
    const o = opts || {}, W = 260, H = 56, vals = values.filter(v => v != null); if (vals.length < 2) return null;
    const max = Math.max(...vals) || 1, bw = W / vals.length;
    const svg = S('svg', {class: 'bars' + (o.onPick ? ' pickable' : ''), viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none', role: 'img', 'aria-label': 'Trend from ' + vals[0].toFixed(1) + ' to ' + vals[vals.length - 1].toFixed(1)});
    const rects = vals.map((v, i) => { const bh = Math.max(2, v / max * (H - 6)); return S('rect', {x: (i * bw + bw * .22).toFixed(1), y: (H - bh).toFixed(1), width: (bw * .56).toFixed(1), height: bh.toFixed(1), rx: 1}); });
    svg.append(...rects);
    const mark = i => rects.forEach((r, j) => r.classList.toggle('on', j === i));
    if (o.onPick) Charts.hits(svg, vals.length, W, H, (i, click) => mark(o.onPick(i, click)), o);

    return svg;
  },
  /* Transparent columns over a small chart: hover previews, click pins; leaving the chart resets. */
  hits(svg, n, W, H, cb, o){
    const bw = W / n;
    for (let i = 0; i < n; i++){
      const r = S('rect', {class: 'hit', x: (n > 1 && svg.classList.contains('spark') ? Math.max(0, i / (n - 1) * W - bw / 2) : i * bw).toFixed(1), y: 0, width: bw.toFixed(1), height: H},
        S('title', null, o.labels ? 'Patch ' + o.labels[i] : ''));
      r.addEventListener('mouseenter', () => cb(i, false));
      r.addEventListener('click', ev => { ev.stopPropagation(); cb(i, true); });
      svg.append(r);
    }
    svg.addEventListener('mouseleave', () => cb(null, false));
  },
  /* points oldest → newest: [{x:'1.17', y:52.4, y2?}] */
  line(points, opts){
    const o = opts || {}, W = o.w || 900, H = o.h || 260, L = o.w ? 78 : 46, Rm = 16, T = 14, B = o.w ? 40 : 34;
    const ys = points.flatMap(p => [p.y, p.y2]).filter(v => v != null); if (ys.length < 2) return null;
    let min = Math.min(...ys), max = Math.max(...ys); const padv = (max - min || 1) * .15; min -= padv; max += padv; if (o.unit === '%'){ min = Math.max(0, min); max = Math.min(100, max); }
    const X = i => L + i / Math.max(1, points.length - 1) * (W - L - Rm), Y = v => T + (1 - (v - min) / (max - min)) * (H - T - B);
    const svg = S('svg', {class: 'chart' + (o.cls ? ' ' + o.cls : ''), viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': o.label || 'History'});
    for (let i = 0; i <= 4; i++){ const v = min + (max - min) * i / 4, y = Y(v); svg.append(S('line', {class: 'g', x1: L, x2: W - Rm, y1: y.toFixed(1), y2: y.toFixed(1)}), S('text', {x: L - 8, y: (y + 3).toFixed(1), 'text-anchor': 'end'}, v.toFixed(o.dec == null ? 1 : o.dec) + (o.unit || ''))); }
    const step = Math.ceil(points.length / (o.ticks || 9));
    points.forEach((p, i) => { if (i % step === 0 || i === points.length - 1) svg.append(S('text', {x: X(i).toFixed(1), y: H - 10, 'text-anchor': i === points.length - 1 ? 'end' : 'middle'}, p.x)); });
    const path = key => { let d = '', pen = false; points.forEach((p, i) => { if (p[key] == null){ pen = false; return; } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p[key]).toFixed(1) + ' '; pen = true; }); return d; };
    if (points.some(p => p.y2 != null)) svg.append(S('path', {class: 'l2', d: path('y2')}));
    svg.append(S('path', {class: 'l', d: path('y')}));
    if (o.dots) points.forEach((p, i) => { if (p.y != null) svg.append(S('circle', {class: 'pt' + (i === points.length - 1 ? ' on' : ''), cx: X(i).toFixed(1), cy: Y(p.y).toFixed(1), r: i === points.length - 1 ? 4.5 : 3})); });
    return svg;
  }
};

/* =============================== BACKGROUND ===============================
   One fixed canvas behind every page: a night sky over still water. A total eclipse
   hangs in the sky (a thin ring, brightest at its lower edge, no rays), there are
   clouds lit faintly from it, a few stars and a faint galaxy band, distant mountains
   on the horizon. The water mirrors all of it and moves only a little.

   Two passes keep it sharp and cheap:
   1. SKY – rendered once per screen size, at the device's full pixel density, into a
      texture. This is where the expensive noise lives.
   2. WATER – every frame (about 30 per second): the sky texture is copied above the
      horizon and mirrored below it with a small, slow ripple. Only texture lookups.
   Each view only sets targets (brightness, phase); the loop eases towards them, so a
   page change is a smooth fade rather than a cut. */
const Fx = {
  cv: null, gl: null, ok: false, raf: 0, running: false, t0: 0, last: 0, sized: false, view: 'home',
  cur: {dim: .45, home: 0}, to: {dim: .45, home: 0},
  HEAD: '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n',
  NOISE: `

float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1.,0.)), f.x), mix(hash(i+vec2(0.,1.)), hash(i+vec2(1.,1.)), f.x), f.y); }

  /* pass 1: sky, mountains, eclipse. Coordinates: y 0..1 bottom to top, x 0..aspect. */

uniform vec2 uRes; uniform float uHor;
vec3 skyAt(vec2 p, float asp){

  col += vec3(.11,.035,.075) * exp(-length((p - E) * vec2(.8, 1.3)) / .45);                 // the eclipse warms its part of the sky
  /* faint galaxy band, diagonal */

  col += vec3(.05,.045,.11) * band * smoothstep(.42, .85, fbm(p*vec2(4.,7.) + 3.1)) * smoothstep(0., .4, h);

  /* pass 2: sky above the horizon, mirrored and gently rippled below */
  WATER: `
uniform sampler2D uSky; uniform vec2 uRes; uniform float uHor, uT, uDim, uHome;

   never an in-progress feed. The page never talks to Omeda or pred.gg match APIs
   directly; it only reads the backend's normalised /api/* answers.

    let list = HEROES.filter(x => (s.role === 'All' || x.roles.includes(s.role)) && (!q || x.name.toLowerCase().includes(q)))

  s: {home: {}, heroes: {role: 'All', q: '', sort: 'name'}, rk: {q: '', open: null}, ev: {}, w: {}, t: null, meta: {role: null, prev: null}, heroAb: {}, adm: {}}, names: {}, lastKey: null, _raf: 0, pending: false,

  build(r){ const v = {home: Views.home, heroes: Views.heroes, hero: Views.hero, rankings: Views.rankings, meta: Views.meta, compare: Views.compare, methodology: Views.methodology, community: COMMUNITY ? Views.community : null, account: Views.account, admin: Views.admin}[r.view]; return v ? v(r.args) : Views.notFound(); },

/* =================================== BOOT ================================= */
(function boot(){
  Persist.load(); I18n.init(); Fx.init(); App.render();
  addEventListener('pagehide', () => { const f = App.s.ev && App.s.ev.flush; f && f(); });
  addEventListener('hashchange', () => { const f = App.s.ev && App.s.ev.flush; f && f(); Shell.overlay && Shell.close(); Shell.pickerOpen = false; App.render(); });
  addEventListener('scroll', () => { const n = $('#nav'), r = App.parse(); if (n) n.classList.toggle('solid', scrollY > 30 || !['home', 'hero', 'compare'].includes(r.view)); }, {passive: true});
  document.addEventListener('click', e => { if (Shell.pickerOpen && !e.target.closest('.pp')){ Shell.pickerOpen = false; App.render(); } });
  document.addEventListener('focusout', () => { if (App.pending) setTimeout(() => { if (App.pending) App.render(true); }, 60); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ if (Shell.close()) e.preventDefault(); return; }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || '')) || e.target.closest('dialog');
    if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')){ e.preventDefault(); Shell.open('search'); }
  });
  $('#dlg-img-save').onclick = () => Exporter.saveFile(); $('#dlg-img-copy').onclick = () => Exporter.copy();

  $('#dlg-code-load').onclick = () => { if (Admin.importConfig($('#dlg-code-in').value)) $('#dlg-code').close(); else $('#dlg-code-msg').textContent = 'This is not a valid AXIOM backup code.'; };
  document.querySelectorAll('dialog [data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
  Auth.init().then(() => Sync.init());
  PredAdapter.refresh();
  /* The live backend URL comes from the shared configuration, which may arrive a moment later. */
  LiveAdapter.refresh(); let lastUrl = LiveAdapter.url(); setInterval(() => { if (LiveAdapter.url() !== lastUrl){ lastUrl = LiveAdapter.url(); LiveAdapter.refresh(true); } }, 2000);
